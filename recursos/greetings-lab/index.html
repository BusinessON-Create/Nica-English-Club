<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --bg: #08080a; --canvas: #0a0a0c; --card: #121214; --card2: #16161a; --card-hover: #1a1a1f;
  --border: #212127; --border2: #2c2c34;
  --gold: #f0b429; --gold2: #c8891a; --gold3: #ffd966;
  --gold-dim: rgba(240,180,41,0.10); --gold-glow: rgba(240,180,41,0.18);
  --red: #ff5c5c; --green: #00d68f; --blue: #4d9fff;
  --muted: #8a8a97; --muted-dim: #55555f; --text: #e8e8f2; --white: #ffffff;
  --r-sm: 14px; --r: 18px; --r-lg: 22px; --r-xl: 30px;
  --shadow-card: 0 20px 50px rgba(0,0,0,.55);
  --ease: cubic-bezier(.22,1,.36,1);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: radial-gradient(120% 100% at 50% -10%, #14140f 0%, var(--bg) 55%) fixed;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}
.font-display { font-family: 'Playfair Display', serif; }
.font-mono { font-family: 'DM Mono', monospace; }

::selection { background: var(--gold-dim); color: var(--gold3); }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

.focus-ring:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ===== Header ===== */
.app-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 4px 22px;
}
.btn-volver {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--card); border: 1px solid var(--border2); color: var(--text);
  transition: border-color .2s var(--ease), color .2s var(--ease);
  text-decoration: none;
}
.btn-volver:hover { border-color: var(--gold2); color: var(--gold3); }
.logo-badge {
  width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
  background: #0a0a0a; display: flex; align-items: center; justify-content: center;
  padding: 6px; box-shadow: 0 0 0 1px var(--border2);
}
.logo-badge img { width: 100%; height: 100%; object-fit: contain; }
.brand-eyebrow { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.brand-title { font-size: 19px; font-weight: 700; line-height: 1.1; }

/* ===== Cards & surfaces ===== */
.surface {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
}
.surface-soft {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: var(--r);
}

/* ===== Buttons ===== */
.btn-gold {
  background: linear-gradient(135deg, var(--gold3), var(--gold2));
  color: #08080a; font-weight: 700;
  border-radius: 999px; transition: transform .18s var(--ease), box-shadow .18s var(--ease);
  box-shadow: 0 10px 24px rgba(200,137,26,.25);
}
.btn-gold:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(200,137,26,.35); }
.btn-gold:active { transform: translateY(0); }

.btn-outline {
  background: transparent; border: 1px solid var(--border2); color: var(--text);
  border-radius: 999px; transition: border-color .18s var(--ease), color .18s var(--ease), background .18s var(--ease);
}
.btn-outline:hover { border-color: var(--gold2); color: var(--gold3); background: var(--gold-dim); }

.btn-speak {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--card2); border: 1px solid var(--border2); color: var(--muted);
  transition: all .18s var(--ease);
}
.btn-speak:hover { color: #08080a; background: linear-gradient(135deg, var(--gold3), var(--gold2)); border-color: transparent; }

.pill { font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: .02em; }
.pill-formal { background: var(--gold-dim); color: var(--gold3); border: 1px solid rgba(240,180,41,.3); }
.pill-coloquial { background: rgba(77,159,255,.12); color: var(--blue); border: 1px solid rgba(77,159,255,.3); }

.input-field {
  background: rgba(255,255,255,.05); border: 1px solid var(--border2); color: var(--text);
  border-radius: var(--r); transition: border-color .18s var(--ease);
}
.input-field:focus { outline: none; border-color: var(--gold2); box-shadow: 0 0 0 3px var(--gold-dim); }

/* ===== Quiz progress ===== */
.progress-track { height: 6px; border-radius: 99px; background: var(--border2); overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold2), var(--gold3)); border-radius: 99px; transition: width .35s var(--ease); }
.strike-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border2); transition: background .2s var(--ease); }
.strike-dot.lost { background: var(--red); }

.quiz-option { transition: all .16s var(--ease); }
.quiz-option.is-correct { border-color: var(--green) !important; background: rgba(0,214,143,.1) !important; color: var(--green) !important; }
.quiz-option.is-incorrect { border-color: var(--red) !important; background: rgba(255,92,92,.1) !important; color: var(--red) !important; }

/* ===== Certificate ===== */
.certificate {
  position: relative; border: 1px solid rgba(240,180,41,.35); border-radius: var(--r-lg);
  padding: 28px 20px; background:
    radial-gradient(120% 120% at 50% 0%, rgba(240,180,41,.08), transparent 60%), var(--card);
}
.certificate::before, .certificate::after {
  content: ''; position: absolute; inset: 8px; border: 1px solid rgba(240,180,41,.18); border-radius: calc(var(--r-lg) - 4px); pointer-events: none;
}
.certificate::after { inset: 8px; }

@keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.rise-in { animation: riseIn .5s var(--ease) both; }

@media (prefers-reduced-motion: reduce) {
  .rise-in { animation: none; }
  .btn-gold:hover, .quiz-option { transition: none; }
}
</style>
</head>

<script>
    const greetings = [
        { id: 1, phrase: "Good morning", pron: "Gud mór-ning", meaning: "Buenos días", type: "Formal", response: "Good morning, how are you?", resPron: "Gud mór-ning, jáu ar iu?", resMeaning: "Buenos días, ¿cómo está?" },
        { id: 2, phrase: "Good afternoon", pron: "Gud áf-ter-nun", meaning: "Buenas tardes", type: "Formal", response: "Good afternoon, nice to see you.", resPron: "Gud áf-ter-nun, náis tu sí iu.", resMeaning: "Buenas tardes, gusto en verte." },
        { id: 3, phrase: "Good evening", pron: "Gud ív-ning", meaning: "Buenas noches (al llegar)", type: "Formal", response: "Good evening, how is your day?", resPron: "Gud ív-ning, jáu ís iór déi?", resMeaning: "Buenas noches, ¿cómo va tu día?" },
        { id: 4, phrase: "Hello, it is a pleasure to meet you", pron: "Je-lóu, it ís a plé-shur tu mít iu", meaning: "Hola, un placer conocerte", type: "Formal", response: "The pleasure is mine.", resPron: "De plé-shur ís máin.", resMeaning: "El placer es mío." },
        { id: 5, phrase: "How do you do?", pron: "Jáu du iu du?", meaning: "¿Cómo está usted?", type: "Formal", response: "How do you do?", resPron: "Jáu du iu du?", resMeaning: "¿Cómo está usted?", note: "Nota: Este es un saludo formal de espejo." },
        { id: 6, phrase: "Hi there!", pron: "Jái dér", meaning: "¡Hola!", type: "Coloquial", response: "Hi! How are you?", resPron: "Jái! Jáu ar iu?", resMeaning: "¡Hola! ¿Cómo estás?" },
        { id: 7, phrase: "How's it going?", pron: "Jáu-sit góu-in?", meaning: "¿Cómo va todo?", type: "Coloquial", response: "Pretty good, thanks!", resPron: "Prí-ti gud, zanks!", resMeaning: "¡Bastante bien, gracias!" },
        { id: 8, phrase: "What's up?", pron: "Uáts-áp?", meaning: "¿Qué tal?", type: "Coloquial", response: "Not much, you?", resPron: "Nót mach, iu?", resMeaning: "Nada mucho, ¿y tú?" },
        { id: 9, phrase: "Good to see you!", pron: "Gud tu sí iu!", meaning: "¡Qué bueno verte!", type: "Coloquial", response: "It's great to see you too!", resPron: "Its gréit tu sí iu tú!", resMeaning: "¡Es genial verte también!" },
        { id: 10, phrase: "How have you been?", pron: "Jáu jav iu bín?", meaning: "¿Cómo has estado?", type: "Formal", response: "I've been well, thank you.", resPron: "Aiv bín uél, zánk iu.", resMeaning: "He estado bien, gracias." },
        { id: 11, phrase: "Nice to see you again", pron: "Náis tu sí iu a-guén", meaning: "Gusto en verte de nuevo", type: "Formal", response: "You too!", resPron: "Iú tú!", resMeaning: "¡Igual tú!" },
        { id: 12, phrase: "Hey! How are things?", pron: "Jéi! Jáu ar zings?", meaning: "¡Hola! ¿Cómo van las cosas?", type: "Coloquial", response: "Everything is going great.", resPron: "Ev-ri-zing ís góu-in gréit.", resMeaning: "Todo va genial." },
        { id: 13, phrase: "Greetings!", pron: "Grí-tings!", meaning: "¡Saludos!", type: "Formal", response: "Hello there!", resPron: "Je-lóu dér!", resMeaning: "¡Hola!" },
        { id: 14, phrase: "Everything is going well, thanks", pron: "Ev-ri-zing ís góu-in uél, zanks", meaning: "Todo va bien, gracias", type: "Coloquial", response: "That's good to hear!", resPron: "Dáts gud tu jíer!", resMeaning: "¡Qué bueno oír eso!" },
        { id: 15, phrase: "I'm doing great, and you?", pron: "Áim dú-in gréit, ánd iu?", meaning: "Estoy genial, ¿y tú?", type: "Coloquial", response: "I'm doing fine, thanks.", resPron: "Áim dú-in fáin, zanks.", resMeaning: "Estoy bien, gracias." },
        { id: 16, phrase: "It's an honor to meet you", pron: "Its an ón-or tu mít iu", meaning: "Es un honor conocerle", type: "Formal", response: "The honor is all mine.", resPron: "De ón-or ís ól máin.", resMeaning: "El honor es todo mío." },
        { id: 17, phrase: "Long time no see!", pron: "Lóng táim nóu sí!", meaning: "¡Cuánto tiempo sin verte!", type: "Coloquial", response: "I know! It's been a while.", resPron: "Ái nóu! Its bín a uáil.", resMeaning: "¡Lo sé! Ha pasado un tiempo." },
        { id: 18, phrase: "How are you doing today?", pron: "Jáu ar iu dú-in tu-déi?", meaning: "¿Cómo estás hoy?", type: "Formal", response: "I'm doing very well, thank you.", resPron: "Áim dú-in vé-ri uél, zánk iu.", resMeaning: "Estoy muy bien, gracias." },
        { id: 19, phrase: "Pretty good, thanks!", pron: "Prí-ti gud, zanks!", meaning: "Muy bien, ¡gracias!", type: "Coloquial", response: "Glad to hear that!", resPron: "Glád tu jíer dát!", resMeaning: "¡Qué alegría oír eso!" },
        { id: 20, phrase: "Have a wonderful day", pron: "Jav a uón-der-ful déi", meaning: "Que tengas un día maravilloso", type: "Formal", response: "You too, take care!", resPron: "Iú tú, téik kér!", resMeaning: "¡Tú también, cuídate!" }
    ];

    let state = { userName: '', score: 0, strikes: 0, currentQuestion: 0, quiz: [] };

    const ICON_SPEAK = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 5V4L8 9H4Z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19 6a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;

    function speak(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    function saludoDelMomento() {
        const h = new Date().getHours();
        if (h < 12) return greetings[0];
        if (h < 19) return greetings[1];
        return greetings[2];
    }

    function renderApp() {
        const app = document.getElementById('app');
        app.innerHTML = !state.userName ? renderLogin() : renderDashboard();
    }

    function renderLogin() {
        const hero = saludoDelMomento();
        return `
            <div class="rise-in">
                <div class="text-center py-8 md:py-10">
                    <p class="font-display italic text-3xl md:text-5xl text-gold3" style="color:var(--gold3)">"${hero.phrase}."</p>
                    <p class="font-mono text-xs md:text-sm mt-3" style="color:var(--muted)">${hero.pron} · ${hero.meaning}</p>
                </div>
                <div class="surface p-6 md:p-8 max-w-md mx-auto text-center">
                    <p class="text-[11px] uppercase tracking-widest font-semibold mb-2" style="color:var(--muted)">Antes de empezar</p>
                    <h2 class="font-display text-xl mb-5">¿Cómo te llamas?</h2>
                    <input type="text" id="userName" class="input-field w-full p-3 text-center focus-ring mb-4" placeholder="Escribe tu nombre" onkeydown="if(event.key==='Enter') login();">
                    <button onclick="login()" class="btn-gold w-full py-3 focus-ring">Comenzar el viaje</button>
                </div>
            </div>
        `;
    }

    function login() {
        const val = document.getElementById('userName').value.trim();
        state.userName = val || 'Trainee';
        renderApp();
    }

    function renderDashboard() {
        return `
            <div class="rise-in">
                <div class="surface p-5 md:p-6 mb-5">
                    <p class="text-sm" style="color:var(--muted)">Bienvenido de nuevo,</p>
                    <h2 class="font-display text-2xl mb-4" style="color:var(--gold3)">${state.userName}</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="renderLibrary()" class="btn-outline focus-ring py-3 px-3 text-sm font-semibold flex flex-col items-center gap-1.5">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 4h9a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4V4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M20 4h-4v14h4" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
                            Biblioteca
                        </button>
                        <button onclick="startQuiz()" class="btn-gold focus-ring py-3 px-3 text-sm flex flex-col items-center gap-1.5">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="currentColor"/></svg>
                            Training Lab
                        </button>
                    </div>
                </div>
                <div id="content-view">
                    <div class="text-center py-14 text-sm" style="color:var(--muted-dim)">Elige una actividad para comenzar.</div>
                </div>
            </div>
        `;
    }

    function renderLibrary() {
        document.getElementById('content-view').innerHTML = `
            <div class="rise-in">
                <h2 class="font-display text-xl mb-4">Biblioteca de interacción</h2>
                <div class="space-y-3">
                    ${greetings.map(g => `
                        <div class="surface-soft p-4">
                            <div class="flex items-start justify-between gap-3 mb-3">
                                <div class="min-w-0">
                                    <span class="pill ${g.type === 'Formal' ? 'pill-formal' : 'pill-coloquial'}">${g.type}</span>
                                    <p class="text-base font-semibold mt-2">${g.phrase}</p>
                                    <p class="font-mono text-xs mt-0.5" style="color:var(--muted)">${g.pron} · ${g.meaning}</p>
                                </div>
                                <button onclick="speak('${g.phrase.replace(/'/g, "\\'")}')" class="btn-speak focus-ring" title="Escuchar">${ICON_SPEAK}</button>
                            </div>
                            <div class="pt-3 flex items-start justify-between gap-3" style="border-top:1px solid var(--border)">
                                <div class="min-w-0">
                                    <p class="text-[10px] uppercase tracking-wide font-semibold mb-1" style="color:var(--muted-dim)">Respuesta sugerida</p>
                                    <p class="text-sm font-medium">${g.response}</p>
                                    <p class="font-mono text-xs mt-0.5" style="color:var(--muted)">${g.resPron} · ${g.resMeaning}</p>
                                </div>
                                <button onclick="speak('${g.response.replace(/'/g, "\\'")}')" class="btn-speak focus-ring" title="Escuchar">${ICON_SPEAK}</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function startQuiz() {
        state.quiz = [...greetings].sort(() => Math.random() - 0.5).slice(0, 15);
        state.currentQuestion = 0;
        state.score = 0;
        state.strikes = 0;
        renderQuiz();
    }

    function renderQuiz() {
        const q = state.quiz[state.currentQuestion];
        const options = [...greetings].sort(() => Math.random() - 0.5).slice(0, 3);
        if (!options.find(o => o.id === q.id)) options[0] = q;
        options.sort(() => Math.random() - 0.5);
        const progressPct = Math.round((state.currentQuestion / state.quiz.length) * 100);

        document.getElementById('content-view').innerHTML = `
            <div class="surface p-5 md:p-7 rise-in">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-xs font-mono" style="color:var(--muted)">Pregunta ${state.currentQuestion + 1} / ${state.quiz.length}</p>
                    <div class="flex gap-1.5">
                        ${[0,1,2].map(i => `<span class="strike-dot ${i < state.strikes ? 'lost' : ''}"></span>`).join('')}
                    </div>
                </div>
                <div class="progress-track mb-6"><div class="progress-fill" style="width:${progressPct}%"></div></div>

                <p class="text-sm mb-2" style="color:var(--muted)">Si alguien te dice:</p>
                <div class="surface-soft p-4 mb-5">
                    <p class="font-display text-xl md:text-2xl" style="color:var(--gold3)">"${q.phrase}"</p>
                    <p class="font-mono text-xs mt-1" style="color:var(--muted)">${q.meaning}</p>
                </div>
                <p class="text-sm font-semibold mb-3">¿Cuál es una respuesta natural?</p>
                <div class="grid gap-2.5" id="quiz-options">
                    ${options.map(opt => `
                        <button data-correct="${opt.id === q.id}" onclick="selectAnswer(this, ${opt.id === q.id})" class="quiz-option focus-ring text-left text-sm p-3.5" style="background:transparent; border:1px solid var(--border2); border-radius:var(--r); color:var(--text);">
                            ${opt.response}
                        </button>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function selectAnswer(btn, isCorrect) {
        const buttons = document.querySelectorAll('#quiz-options .quiz-option');
        buttons.forEach(b => b.onclick = null);
        btn.classList.add(isCorrect ? 'is-correct' : 'is-incorrect');
        if (!isCorrect) {
            buttons.forEach(b => { if (b.dataset.correct === 'true') b.classList.add('is-correct'); });
        }
        setTimeout(() => checkAnswer(isCorrect), 700);
    }

    function checkAnswer(isCorrect) {
        if (isCorrect) {
            state.score++;
            state.currentQuestion++;
        } else {
            state.strikes++;
            if (state.strikes >= 3) {
                renderDashboard();
                return;
            }
        }
        if (state.currentQuestion >= state.quiz.length) renderResults();
        else renderQuiz();
    }

    function renderResults() {
        const passed = state.strikes < 3;
        document.getElementById('content-view').innerHTML = `
            <div class="rise-in text-center">
                ${passed ? `
                <div class="certificate">
                    <p class="text-[10px] uppercase tracking-widest font-semibold mb-3" style="color:var(--gold3)">Certificado de fluidez</p>
                    <h2 class="font-display text-2xl md:text-3xl mb-2">Greetings & Responses</h2>
                    <p class="text-sm mb-5" style="color:var(--muted)">Otorgado a</p>
                    <p class="font-display italic text-2xl mb-6" style="color:var(--gold3)">${state.userName}</p>
                    <p class="text-xs" style="color:var(--muted-dim)">Nica English Club · ${new Date().toLocaleDateString('es-NI', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
                </div>
                ` : `
                <div class="surface p-8">
                    <h2 class="font-display text-2xl mb-2">Sigamos practicando</h2>
                    <p class="text-sm" style="color:var(--muted)">El inglés se construye con constancia. Repasa la biblioteca e inténtalo de nuevo.</p>
                </div>
                `}
                <button onclick="renderDashboard()" class="btn-gold w-full py-3 mt-5 focus-ring">Volver al dashboard</button>
            </div>
        `;
    }

    renderApp();
</script>
</body>
</html>
