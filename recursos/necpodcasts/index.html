<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEC Podcasts · Nica English Club</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0908;--card:#131110;--card2:#1a1714;--line:#2a2520;--line2:#38322b;--tx:#f4efe6;--mut:#9a948a;--gold:#f0b429;--gold2:#ffd966;--gold3:#c8891a;--ok:#2fbf6b;--bad:#ff6a1a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{background:var(--bg);color:var(--tx);font:400 16px/1.55 Figtree,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3,.btn,.pill{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 60px}
header{display:flex;align-items:center;gap:12px;padding:18px 0}
header img{width:46px;height:46px}
header b{font:700 15px 'Bricolage Grotesque',sans-serif;letter-spacing:.02em;line-height:1.1}
header small{display:block;color:var(--mut);font:500 12px Figtree}
header a{margin-left:auto;color:var(--mut);font-size:14px;cursor:pointer;text-decoration:none}
header a:hover{color:var(--gold)}
h1{font-size:clamp(30px,7vw,44px);line-height:1.05;letter-spacing:-.03em;margin:10px 0 6px}
h1 em{font-style:normal;background:#0a0a0a;color:#FFD60A;padding:0 .18em .05em;border-radius:.2em;display:inline-block;transform:rotate(-2deg);border:1px solid var(--line2)}
.sub{color:var(--mut);margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.list{display:grid;gap:12px}
.ep{display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit;transition:border-color .2s,transform .2s}
.ep:hover{border-color:var(--gold);transform:translateY(-2px)}
.ep .n{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#0a0908;display:grid;place-items:center;font:800 18px 'Bricolage Grotesque';flex:none}
.ep h3{font-size:18px}.ep p{color:var(--mut);font-size:14px}
.pill{font-size:12px;font-weight:700;border:1px solid var(--line2);color:var(--gold);border-radius:99px;padding:2px 10px;margin-left:auto;white-space:nowrap}
.steps{display:flex;gap:8px;margin:6px 0 18px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line);font-style:normal}
.steps i.on{background:var(--gold)}
.phase{color:var(--gold);font:700 13px 'Bricolage Grotesque';letter-spacing:.1em;text-transform:uppercase}
h2{font-size:26px;letter-spacing:-.02em;margin:4px 0 4px}
.hint{color:var(--mut);font-size:14px;margin-bottom:14px}
audio{width:100%;margin:6px 0 12px;filter:invert(.92) sepia(.4) hue-rotate(-10deg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.btn{border:1px solid var(--line2);background:var(--card2);color:var(--tx);border-radius:99px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--gold)}
.btn.on{background:var(--gold);color:#0a0908;border-color:var(--gold)}
.btn.main{background:var(--gold);color:#0a0908;border-color:var(--gold);box-shadow:0 4px 0 var(--gold3);padding:12px 22px;font-size:15px}
.btn.main:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold3)}
.btn[disabled]{opacity:.4;cursor:default}
.txt{display:grid;gap:4px;font-size:19px;line-height:1.5}
.txt p{padding:8px 12px;border-radius:12px;border:1px solid transparent;cursor:pointer;color:var(--mut);transition:.2s}
.txt p:hover{color:var(--tx)}
.txt p.now{background:rgba(240,180,41,.12);border-color:rgba(240,180,41,.45);color:var(--gold2)}
.hidden{border:1px dashed var(--line2);border-radius:16px;padding:26px;text-align:center;color:var(--mut)}
.hidden b{display:block;font:700 40px 'Bricolage Grotesque';color:var(--gold)}
.q{margin:6px 0 2px;font:700 21px/1.3 'Bricolage Grotesque'}
.cnt{color:var(--mut);font-size:13px}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;border:1px solid var(--line2);background:var(--card2);color:var(--tx);border-radius:16px;padding:14px 16px;font:600 16px Figtree;cursor:pointer;transition:.15s}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt.ok{border-color:var(--ok);background:rgba(47,191,107,.14)}
.opt.bad{border-color:var(--bad);background:rgba(255,106,26,.14)}
.score{font:800 64px/1 'Bricolage Grotesque';color:var(--gold);margin:8px 0}
.rev{display:grid;gap:8px;margin:14px 0;font-size:15px}
.rev div{border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.rev .ok{border-color:rgba(47,191,107,.5)}.rev .bad{border-color:rgba(255,106,26,.5)}
.rev small{color:var(--mut);display:block}
.pool{color:var(--mut);font-size:13px;margin-top:10px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="logo.png" alt="Nica English Club"><div><b>NEC PODCASTS</b><small>Nica English Club · Training Room</small></div><a id="back" hidden>← Podcasts</a></header>
<main id="app"></main>
<footer>No estudies inglés. Entrénalo.</footer>
</div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let eps=[],cur=null,audio=null;
$('#back').onclick=()=>{if(audio)audio.pause();home()};

async function init(){
  try{eps=await (await fetch('podcasts.json')).json()}catch(e){app.innerHTML='<div class="card">No se pudo cargar podcasts.json. Abre la página desde GitHub Pages (no con doble clic).</div>';return}
  home();
}
function home(){
  $('#back').hidden=true;
  app.innerHTML=`<h1>Escucha. Repite. <em>Responde.</em></h1><p class="sub">Elige un podcast: primero lees y escuchas, luego solo escuchas, y al final respondes preguntas.</p><div class="list">${eps.map((e,i)=>{const b=LS.get('best:'+e.id,null);return `<button class="card ep" data-i="${i}"><span class="n">${i+1}</span><div><h3>${esc(e.title)}</h3><p>${esc(e.desc||'')}</p></div><span class="pill">${b!==null?'Mejor '+b+'%':esc(e.level||'')}</span></button>`}).join('')}</div>`;
  app.querySelectorAll('.ep').forEach(b=>b.onclick=()=>open(eps[b.dataset.i]));
}
async function open(e){
  try{cur=await (await fetch(`podcasts/${e.id}/data.json`)).json()}catch(x){app.innerHTML='<div class="card">No se encontró data.json de este podcast.</div>';return}
  cur.id=e.id;cur.level=e.level||'';cur.src=`podcasts/${e.id}/${cur.audio||'audio.mp3'}`;
  $('#back').hidden=false;phase(1);
}
function stepsBar(n){return `<div class="steps">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`}
function player(){return `<audio id="au" controls preload="metadata" src="${cur.src}"></audio>
<div class="ctl"><button class="btn" data-r=".75">0.75×</button><button class="btn on" data-r="1">1×</button><button class="btn" data-r="1.25">1.25×</button><button class="btn" id="loop">↻ Repetir frase</button></div>`}
function phase(n){
  if(audio)audio.pause();
  if(n===3)return quiz();
  const withText=n===1;
  app.innerHTML=`${stepsBar(n)}<div class="card"><div class="phase">Paso ${n} de 3 · ${esc(cur.level)}</div><h2>${esc(cur.title)}</h2><p class="hint">${withText?'Lee y escucha. Toca una frase para repetirla y hacer shadowing.':'Ahora solo audio. Escucha con atención, sin texto.'}</p>${player()}
  ${withText?`<div class="txt">${cur.sentences.map((s,i)=>`<p data-i="${i}">${esc(s.t)}</p>`).join('')}</div>`:`<div class="hidden"><b>🎧</b>Texto oculto</div>`}
  <div class="ctl" style="margin-top:18px"><button class="btn main" id="next">${withText?'Siguiente: sin texto →':'Ir a las preguntas →'}</button>${n===2?'<button class="btn" id="prev">← Ver texto</button>':''}</div></div>`;
  audio=$('#au');let loop=false,idx=-1;
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{audio.playbackRate=+b.dataset.r;app.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b))});
  $('#loop').onclick=e=>{loop=!loop;e.target.classList.toggle('on',loop)};
  const ps=[...app.querySelectorAll('.txt p')];
  ps.forEach((p,i)=>p.onclick=()=>{const s=cur.sentences[i];if(s.s!=null){audio.currentTime=s.s;audio.play()}});
  audio.ontimeupdate=()=>{
    if(!withText)return;
    const t=audio.currentTime;let k=cur.sentences.findIndex(s=>s.s!=null&&t>=s.s&&t<s.e);
    if(loop&&idx>-1&&cur.sentences[idx].e!=null&&t>=cur.sentences[idx].e-.05){audio.currentTime=cur.sentences[idx].s;return}
    if(k!==idx){idx=k;ps.forEach((p,i)=>p.classList.toggle('now',i===k));if(k>-1)ps[k].scrollIntoView({block:'nearest',behavior:'smooth'})}
  };
  $('#next').onclick=()=>phase(n+1);
  if($('#prev'))$('#prev').onclick=()=>phase(1);
}
/* Selección de preguntas: prioriza las no vistas; al agotarse reinicia el ciclo */
function pick(){
  const all=cur.questions.map((_,i)=>i),n=Math.min(cur.quizSize||8,all.length),key='seen:'+cur.id;
  let seen=LS.get(key,[]).filter(i=>i<all.length);
  const fresh=all.filter(i=>!seen.includes(i));
  let chosen;
  if(fresh.length>=n){chosen=shuffle(fresh).slice(0,n);seen=seen.concat(chosen)}
  else{ /* se agotaron: empieza un ciclo nuevo con las que faltaban + relleno de las ya vistas */
    chosen=fresh.concat(shuffle(all.filter(i=>!fresh.includes(i))).slice(0,n-fresh.length));seen=[...chosen]}
  LS.set(key,seen);
  return {ids:shuffle(chosen),left:all.length-seen.length};
}
function quiz(){
  const {ids,left}=pick();
  const qs=ids.map(i=>{const q=cur.questions[i],ok=q.o[q.a],o=shuffle(q.o);return{q:q.q,o,ok}});
  let k=0,score=0,log=[];
  const show=()=>{
    const q=qs[k];
    app.innerHTML=`${stepsBar(3)}<div class="card"><div class="phase">Paso 3 de 3 · Preguntas</div><div class="cnt">Pregunta ${k+1} de ${qs.length}</div><p class="q">${esc(q.q)}</p><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="ctl"><button class="btn main" id="nx" hidden>${k+1<qs.length?'Siguiente →':'Ver resultado'}</button></div></div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const pick=q.o[b.dataset.i],good=pick===q.ok;if(good)score++;log.push({q:q.q,pick,ok:q.ok,good});
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.o[x.dataset.i]===q.ok)x.classList.add('ok')});
      if(!good)b.classList.add('bad');$('#nx').hidden=false;
    });
    $('#nx').onclick=()=>{k++;k<qs.length?show():end()};
  };
  const end=()=>{
    const pct=Math.round(score/qs.length*100),best=Math.max(pct,LS.get('best:'+cur.id,0));LS.set('best:'+cur.id,best);
    app.innerHTML=`${stepsBar(3)}<div class="card"><div class="phase">Resultado</div><div class="score">${score}/${qs.length}</div><p>${pct>=80?'¡Excelente! 🔥':pct>=50?'Buen trabajo. Repite para mejorar.':'Escucha otra vez con el texto y vuelve a intentar.'}</p>
    <div class="rev">${log.map(l=>`<div class="${l.good?'ok':'bad'}">${l.good?'✓':'✗'} ${esc(l.q)}<small>${l.good?esc(l.ok):'Tu respuesta: '+esc(l.pick)+' · Correcta: '+esc(l.ok)}</small></div>`).join('')}</div>
    <div class="ctl"><button class="btn main" id="again">Intentar con preguntas nuevas</button><button class="btn" id="relisten">Escuchar con texto</button><button class="btn" id="hm">Todos los podcasts</button></div>
    <p class="pool">${left>0?`Te quedan ${left} preguntas sin ver.`:'Ya viste todas las preguntas. El ciclo se reinicia.'}</p></div>`;
    $('#again').onclick=quiz;$('#relisten').onclick=()=>phase(1);$('#hm').onclick=home;
  };
  show();
}
init();
</script>
</body>
</html>
