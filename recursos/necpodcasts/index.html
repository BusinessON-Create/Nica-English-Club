<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEC Podcasts · Nica English Club</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0908;--card:#131110;--card2:#1a1714;--line:#2a2520;--line2:#38322b;--tx:#f4efe6;--mut:#9a948a;--gold:#f0b429;--gold2:#ffd966;--gold3:#c8891a;--ok:#2fbf6b;--bad:#ff6a1a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 420px at 50% -140px,rgba(240,180,41,.14),transparent 70%),var(--bg);color:var(--tx);font:400 16px/1.55 Figtree,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3,.btn,.chip,b{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 50px}
header{display:flex;align-items:center;gap:12px;padding:16px 0}
header img{width:46px;height:46px}
header b{font-size:15px;letter-spacing:.03em;line-height:1.1}
header small{display:block;color:var(--mut);font:500 12px Figtree}
#back{margin-left:auto;color:var(--tx);font:700 14px 'Bricolage Grotesque';text-decoration:none;border:1px solid var(--line2);border-radius:99px;padding:8px 14px}
#back:hover{border-color:var(--gold);color:var(--gold)}
h1{font-size:clamp(32px,7.5vw,54px);line-height:1.02;letter-spacing:-.035em;margin:8px 0 8px}
h1 em{font-style:normal;background:#0a0a0a;color:#FFD60A;padding:0 .16em .05em;border-radius:.2em;display:inline-block;transform:rotate(-2deg);border:1px solid var(--line2)}
.sub{color:var(--mut);margin-bottom:22px;max-width:520px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--card);color:var(--tx);border-radius:99px;padding:9px 18px;font-weight:700;font-size:15px;cursor:pointer;transition:.15s}
.chip small{margin-left:8px;color:var(--mut);font:600 12px Figtree}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);color:#0a0908;border-color:var(--gold)}.chip.on small{color:#0a0908}
.lvt{font-size:24px;letter-spacing:-.02em;margin:10px 0 14px}.lvt span{color:var(--mut);font:500 15px Figtree;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px}
.pc{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;transition:.25s}
.pc:hover{background:var(--card2);transform:translateY(-4px);border-color:var(--line2)}
.cv{position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 16% 10%,var(--c1),transparent 60%),radial-gradient(circle at 92% 96%,var(--c2),transparent 58%),#1a1714}
.cv .lt{font:800 clamp(60px,10vw,88px)/1 'Bricolage Grotesque';color:rgba(10,9,8,.9);letter-spacing:-.06em;transform:rotate(-4deg)}
.cv img{position:absolute;left:9px;bottom:9px;width:30px;filter:brightness(0);opacity:.55}
.pb{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:#0a0908;color:var(--gold);display:grid;place-items:center;opacity:0;transform:translateY(10px);transition:.25s;box-shadow:0 8px 18px rgba(0,0,0,.5)}
.pb svg{width:22px;height:22px;fill:currentColor}
.pc:hover .pb{opacity:1;transform:none}
@media(hover:none){.pb{opacity:1;transform:none}}
.pc h3{font-size:16px;margin:12px 0 2px;letter-spacing:-.01em;line-height:1.2}
.pc p{color:var(--mut);font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc small{display:block;margin-top:8px;color:var(--gold);font-weight:600;font-size:12px}
.empty{border:1px dashed var(--line2);border-radius:20px;padding:44px 20px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--gold);font-size:26px;margin-bottom:4px}
.steps{display:flex;gap:8px;margin:4px 0 18px}
.steps div{flex:1;font:600 12px Figtree;color:var(--mut)}
.steps i{display:block;height:5px;border-radius:9px;background:var(--line);margin-bottom:6px}
.steps .on{color:var(--gold)}.steps .on i{background:var(--gold)}
.pg{display:grid;gap:18px}
@media(min-width:900px){.pg{grid-template-columns:minmax(0,430px) 1fr;gap:44px;align-items:start}}
.stage{position:relative;width:min(80vw,350px);aspect-ratio:1;margin:6px auto 0}
.glow{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,rgba(240,180,41,.38),transparent 68%);transform:scale(calc(1 + var(--b,0)*.4));transition:transform .08s}
canvas{position:absolute;inset:0;width:100%;height:100%}
.disc{position:absolute;inset:18.5%;border-radius:50%;border:2px solid var(--gold3);box-shadow:0 0 40px rgba(240,180,41,.25),inset 0 0 26px #000;background:conic-gradient(from 0deg,transparent 0 70%,rgba(240,180,41,.2) 88%,transparent 96%),repeating-radial-gradient(circle,#15120f 0 3px,#0c0a08 3px 6px);animation:spin 9s linear infinite;animation-play-state:paused}
.playing .disc{animation-play-state:running}
.lg{position:absolute;left:50%;top:50%;width:34%;transform:translate(-50%,-50%);pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.meta{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px}
.meta b{font-size:17px}
.lvpill{border:1px solid var(--gold3);color:var(--gold);border-radius:99px;padding:1px 10px;font:700 12px 'Bricolage Grotesque'}
.cap{min-height:100px;display:grid;place-items:center;text-align:center;margin:8px 0}
.cap .sn{font:700 clamp(22px,5vw,30px)/1.2 'Bricolage Grotesque';color:var(--gold2);letter-spacing:-.01em}
.cap.pop .sn{animation:capin .35s ease-out}
@keyframes capin{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.idle{color:var(--mut)}
.seek{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
input[type=range]{flex:1;accent-color:var(--gold);height:24px}
.ctrl{display:flex;justify-content:center;align-items:center;gap:24px;margin:8px 0}
.ctrl button{background:none;border:0;color:var(--tx);cursor:pointer;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.ctrl button:hover{color:var(--gold)}
.ctrl svg{width:26px;height:26px;fill:currentColor}
.ctrl .big{background:var(--gold);color:#0a0908;width:72px;height:72px;box-shadow:0 4px 0 var(--gold3);transition:transform .1s}
.ctrl .big:hover{color:#0a0908}.ctrl .big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold3)}
.big svg{width:34px;height:34px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.btn{border:1px solid var(--line2);background:var(--card2);color:var(--tx);border-radius:99px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--gold)}
.btn.on{background:var(--gold);color:#0a0908;border-color:var(--gold)}
.btn.main{background:var(--gold);color:#0a0908;border-color:var(--gold);box-shadow:0 4px 0 var(--gold3);padding:12px 22px;font-size:15px}
.btn.main:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.tr{max-height:min(50vh,440px);overflow:auto;position:relative;display:grid;gap:4px;font-size:18px;line-height:1.5;margin-bottom:16px;padding:12px}
.tr p{padding:8px 12px;border-radius:12px;border:1px solid transparent;cursor:pointer;color:var(--mut);transition:.2s}
.tr p:hover{color:var(--tx)}
.tr p.now{background:rgba(240,180,41,.12);border-color:rgba(240,180,41,.45);color:var(--gold2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hs{position:relative;background:none;border:0;color:var(--gold);cursor:pointer;display:grid;justify-items:center;gap:6px;padding:4px 24px}
.hs svg{width:90px;height:90px;position:relative;z-index:1;animation:float 3.4s ease-in-out infinite}
.hs b{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
.rip{position:absolute;left:50%;top:49px;width:90px;height:90px;transform:translate(-50%,-50%)}
.rip i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);opacity:0;animation:rip 2.4s ease-out infinite;animation-play-state:paused}
.rip i:nth-child(2){animation-delay:.8s}.rip i:nth-child(3){animation-delay:1.6s}
.playing .rip i{animation-play-state:running}
.eqb{transform-box:fill-box;transform-origin:center;animation:eq .9s ease-in-out infinite;animation-play-state:paused}
.playing .eqb{animation-play-state:running}
@keyframes rip{0%{transform:scale(.7);opacity:.7}100%{transform:scale(2.1);opacity:0}}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.5)}}
@keyframes float{50%{transform:translateY(-5px)}}
.qwrap{max-width:620px;margin:0 auto}
.phase{color:var(--gold);font:700 13px 'Bricolage Grotesque';letter-spacing:.1em;text-transform:uppercase}
.cnt{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;margin-top:4px}
.strikes{display:flex;gap:6px;align-items:center}.strikes i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2)}.strikes i.x{background:var(--bad);border-color:var(--bad)}
.q{margin:8px 0 2px;font:700 22px/1.3 'Bricolage Grotesque'}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;border:1px solid var(--line2);background:var(--card2);color:var(--tx);border-radius:16px;padding:14px 16px;font:600 16px Figtree;cursor:pointer;transition:.15s}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt.ok{border-color:var(--ok);background:rgba(47,191,107,.14)}
.opt.bad{border-color:var(--bad);background:rgba(255,106,26,.14)}
.score{font:800 64px/1 'Bricolage Grotesque';color:var(--gold);margin:8px 0}
.rev{display:grid;gap:8px;margin:14px 0;font-size:15px}
.rev div{border:1px solid var(--line);border-radius:14px;padding:10px 14px}.rev .ok{border-color:rgba(47,191,107,.5)}.rev .bad{border-color:rgba(255,106,26,.5)}
.rev small{color:var(--mut);display:block}
.retry{text-align:center}.retry .bx{font:800 54px 'Bricolage Grotesque';color:var(--bad)}.retry h2{font-size:28px;margin:6px 0}.retry p{color:var(--mut);margin:8px 0 18px}.retry p b{color:var(--gold);font-size:20px}
.pool{color:var(--mut);font-size:13px;margin-top:10px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:26px 0}
.tr[hidden],.cont[hidden]{display:none}
.cont{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--card2);border:1px solid var(--gold3);border-radius:18px;padding:12px 14px;margin:4px 0 10px;animation:capin .3s ease-out}
.cont p{flex:1 1 180px;font-size:15px;line-height:1.35}.cont p b{color:var(--gold2)}.cont p i{font-style:normal;color:var(--mut);display:block;font-size:13px}
.wd{display:inline-block;background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;padding:10px 2px;margin:-10px 0;cursor:pointer;border-radius:8px;-webkit-tap-highlight-color:transparent}
.wd:hover,.wd:focus-visible{background:rgba(240,180,41,.18);outline:0}
.wd.sv{text-decoration:underline dotted var(--gold3);text-underline-offset:5px}
.nb{padding:0;overflow:hidden;margin-bottom:12px;background:linear-gradient(90deg,transparent 41px,rgba(255,106,26,.3) 41px 42px,transparent 42px),repeating-linear-gradient(180deg,transparent 0 31px,rgba(240,180,41,.14) 31px 32px),#100e0c;background-position:0 0,0 8px}
.nbh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px 8px 56px;font:700 13px 'Bricolage Grotesque';letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.nbh span{color:var(--mut);font:500 13px Figtree;text-transform:none;letter-spacing:0}
.nbe{padding:6px 18px 14px 56px;color:var(--mut);line-height:32px}
.nbl{max-height:min(46vh,380px);overflow:auto}
.en{padding:4px 10px 6px 56px;animation:capin .3s ease-out}
.er{display:flex;align-items:center;gap:2px}
.ew{flex:1;min-width:0;line-height:32px}.ew b{font-size:19px;color:var(--gold2);margin-right:10px}.tl{font-size:17px}.tl.dim{color:var(--mut)}
.cx{display:block;color:var(--mut);font-size:13px;line-height:1.35;margin:-2px 0 6px}
.ib{flex:none;min-width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--tx);font-size:18px;cursor:pointer}.ib:hover{background:rgba(240,180,41,.14)}
.mn{display:inline-flex;gap:4px;vertical-align:middle}.mn .in{width:min(180px,40vw)}
.in{background:#0a0908;border:1px solid var(--line2);color:var(--tx);border-radius:12px;padding:0 12px;height:44px;font:500 16px Figtree;min-width:0}.in:focus{outline:0;border-color:var(--gold)}
.add{display:flex;gap:6px;padding:10px 10px 10px 56px;border-top:1px solid var(--line)}.add .in{flex:1}
.ib.dir{border-radius:99px;border:1px solid var(--line2);font:700 13px 'Bricolage Grotesque';padding:0 12px;white-space:nowrap}
.ib.gold{background:var(--gold);color:#0a0908;font-weight:800;font-size:22px}
.nbm{padding:0 18px 10px 56px;font-size:13px;color:var(--bad)}.nbm:empty{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="logo.png" alt="Nica English Club"><div><b>NEC PODCASTS</b><small>Nica English Club · Training Room</small></div><a id="back" href="#/" hidden>← Podcasts</a></header>
<main id="app"></main>
<footer>No estudies inglés. Entrénalo.</footer>
</div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')};
const LEVELS=['A1','A2','B1','B2','C1'],LN={A1:'Principiante',A2:'Elemental',B1:'Intermedio',B2:'Intermedio alto',C1:'Avanzado'};
const LV={A1:['#f0b429','#c8891a'],A2:['#ffd966','#f0b429'],B1:['#ff9a3d','#f0b429'],B2:['#ff6a1a','#d92c0e'],C1:['#f4efe6','#f0b429']};
const IC={play:'<path d="M8 5v14l11-7z"/>',pause:'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>',prev:'<path d="M6 5h2v14H6zM20 5v14L9 12z"/>',next:'<path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/>'};
const svg=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
let eps=[],cur=null,cleanup=null,tm=null;
function stopAll(){if(cleanup)cleanup();cleanup=null;clearInterval(tm)}

async function route(){
  stopAll();
  if(!eps.length){try{eps=await (await fetch('podcasts.json')).json()}catch(e){app.innerHTML='<div class="card">No se pudo cargar podcasts.json. Abre la página desde GitHub Pages, no con doble clic.</div>';return}}
  const h=location.hash;
  if(h==='#/cuaderno')mybook();else if(h.startsWith('#/p/'))openPlayer(decodeURIComponent(h.slice(4)));else home();
}
addEventListener('hashchange',route);

/* ---------- Cuaderno de vocabulario ---------- */
const DE_EMAIL=''; /* PON AQUÍ TU CORREO (opcional): sube el límite diario de MyMemory */
const getV=id=>LS.get('vocab:'+id,[]),setV=(id,v)=>LS.set('vocab:'+id,v),pending=new Set();
const clean=w=>w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'');
const words=t=>t.split(/(\s+)/).map(p=>{const c=clean(p);return c?`<button class="wd" data-w="${esc(c)}">${esc(p)}</button>`:esc(p)}).join('');
async function translate(text,dir){
  const key=dir+'|'+text.toLowerCase().trim(),c=LS.get('trcache',{});
  if(c[key])return c[key];
  const[f,t]=dir==='es-en'?['es','en']:['en','es'];
  const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${f}%7C${t}`+(DE_EMAIL?`&de=${encodeURIComponent(DE_EMAIL)}`:''));
  if(!r.ok)throw new Error('http');
  const d=await r.json(),m=String(d.responseData&&d.responseData.translatedText||'').trim();
  if(+d.responseStatus!==200||d.quotaFinished||!m||/MYMEMORY WARNING|INVALID/i.test(m))throw new Error('quota');
  const seen=new Set([m.toLowerCase()]),list=[m];
  (d.matches||[]).forEach(x=>{const v=String(x.translation||'').trim(),k=v.toLowerCase();if(v&&list.length<2&&!seen.has(k)){seen.add(k);list.push(v)}});
  c[key]=list;LS.set('trcache',c);return list;
}
const speak=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}catch(e){}};
const entryHTML=(x,ctx,pid)=>`<div class="en" data-id="${x.id}" data-p="${esc(pid)}"><div class="er"><div class="ew"><b>${esc(x.w)}</b>${x.tr&&x.tr.length?`<span class="tl">${x.tr.map(esc).join(' · ')}</span>`:pending.has(x.id)?'<span class="tl dim">traduciendo…</span>':'<span class="mn"><input class="in" placeholder="Escribe la traducción" aria-label="Traducción"><button class="ib sv" aria-label="Guardar traducción">✓</button></span>'}</div><button class="ib sp" aria-label="Escuchar pronunciación">🔊</button><button class="ib dl" aria-label="Borrar">🗑</button></div>${ctx&&x.ctx?`<small class="cx">${esc(x.ctx)}</small>`:''}</div>`;
function wire(root,redraw){root.onclick=e=>{const b=e.target.closest('button'),en=e.target.closest('.en');if(!b||!en)return;
  const P=en.dataset.p,L=getV(P),i=L.findIndex(x=>x.id===en.dataset.id);if(i<0)return;
  if(b.classList.contains('sp')){const x=L[i];speak(x.dir==='es-en'?(x.tr&&x.tr[0]||''):x.w)}
  else if(b.classList.contains('dl')){L.splice(i,1);setV(P,L);redraw()}
  else if(b.classList.contains('sv')){const v=en.querySelector('.in').value.trim();if(v){L[i].tr=[v];setV(P,L);redraw()}}}}
function mybook(){
  $('#back').hidden=false;document.title='Mi cuaderno · NEC Podcasts';
  const draw=()=>{const g=eps.map(e=>({e,L:getV(e.id)})).filter(x=>x.L.length),n=g.reduce((s,x)=>s+x.L.length,0);
    app.innerHTML=`<h1 style="font-size:clamp(30px,7vw,46px)">Mi <em>cuaderno</em></h1><p class="sub">${n?`${n} ${n===1?'anotación':'anotaciones'} de todos tus podcasts.`:'Aún no hay palabras. Abre un podcast y toca una palabra de la frase amarilla.'}</p>${g.map(x=>`<h2 class="lvt">${esc(x.e.title)}<span>${esc(x.e.level||'')}</span></h2><div class="card nb"><div class="nbl" style="max-height:none">${x.L.slice().reverse().map(y=>entryHTML(y,true,x.e.id)).join('')}</div></div>`).join('')}`;
    app.querySelectorAll('.nbl').forEach(el=>wire(el,draw))};
  draw();
}

/* ---------- Galería ---------- */
const card=e=>{const b=LS.get('best:'+e.id,null),c=LV[e.level]||LV.A1;
  return `<a class="pc" href="#/p/${encodeURIComponent(e.id)}" style="--c1:${c[0]};--c2:${c[1]}"><div class="cv"><span class="lt">${esc(e.level)}</span><img src="logo.png" alt=""><i class="pb">${svg(IC.play)}</i></div><h3>${esc(e.title)}</h3><p>${esc(e.desc||'')}</p><small>${esc(e.dur||'')}${b!==null?' · Mejor '+b+'%':''}</small></a>`};
function home(){
  $('#back').hidden=true;document.title='NEC Podcasts · Nica English Club';
  const lv=LS.get('lvl','A1'),list=eps.filter(e=>e.level===lv);
  app.innerHTML=`<h1>Escucha. Repite. <em>Responde.</em></h1><p class="sub">Tu galería de podcasts para entrenar el oído. Elige tu nivel y empieza.</p>
  <div class="chips">${LEVELS.map(l=>`<button class="chip${l===lv?' on':''}" data-l="${l}">${l}<small>${eps.filter(e=>e.level===l).length||'—'}</small></button>`).join('')}<a class="chip" href="#/cuaderno" style="text-decoration:none">📓 Mi cuaderno<small>${eps.reduce((s,e)=>s+getV(e.id).length,0)}</small></a></div>
  <h2 class="lvt">Nivel ${lv}<span>${LN[lv]}</span></h2>
  ${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty"><b>Próximamente</b>Estamos preparando los podcasts de ${lv}.</div>`}`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{LS.set('lvl',b.dataset.l);home()});
}

/* ---------- Reproductor ---------- */
const steps=n=>`<div class="steps">${['Leer y escuchar','Solo audio','Preguntas'].map((t,i)=>`<div class="${i+1<=n?'on':''}"><i></i>${i+1}. ${t}</div>`).join('')}</div>`;
const headset=()=>`<button class="hs" id="hs" aria-label="Texto oculto. Toca para reproducir o pausar"><span class="rip"><i></i><i></i><i></i></span>
<svg viewBox="0 0 120 120" fill="none"><path d="M24 68C24 38 40 20 60 20s36 18 36 48" stroke="#f0b429" stroke-width="7" stroke-linecap="round"/><rect x="14" y="62" width="22" height="36" rx="11" fill="#f0b429"/><rect x="84" y="62" width="22" height="36" rx="11" fill="#f0b429"/><path d="M95 96c0 12-12 14-28 12" stroke="#c8891a" stroke-width="4" stroke-linecap="round"/><circle cx="62" cy="108" r="5" fill="#ffd966"/>
<g fill="#ffd966"><rect class="eqb" x="44" y="50" width="5" height="22" rx="2.5"/><rect class="eqb" style="animation-delay:.15s" x="53" y="44" width="5" height="34" rx="2.5"/><rect class="eqb" style="animation-delay:.3s" x="62" y="50" width="5" height="22" rx="2.5"/><rect class="eqb" style="animation-delay:.45s" x="71" y="46" width="5" height="30" rx="2.5"/></g></svg><b>Texto oculto</b></button>`;

async function openPlayer(id){
  const e=eps.find(x=>x.id===id);if(!e){location.hash='#/';return}
  try{cur=await (await fetch(`podcasts/${id}/data.json`)).json()}catch(x){app.innerHTML='<div class="card">No se encontró data.json de este podcast.</div>';return}
  if(location.hash!=='#/p/'+encodeURIComponent(id))return;
  cur.id=id;cur.level=e.level||cur.level||'';cur.src=`podcasts/${id}/${cur.audio||'audio.mp3'}`;
  $('#back').hidden=false;document.title=cur.title+' · NEC Podcasts';phase(1);
}
function phase(n){
  stopAll();scrollTo(0,0);
  if(n===3)return quiz();
  const hid=n===2,S=cur.sentences;
  app.innerHTML=`${steps(n)}<div class="pg"><div class="left">
  <div class="stage" id="stage"><div class="glow"></div><canvas id="cv"></canvas><div class="disc"></div><img class="lg" src="logo.png" alt=""></div>
  <div class="meta"><span class="lvpill">${esc(cur.level)}</span><b>${esc(cur.title)}</b></div>
  <div class="cap" id="cap">${hid?headset():'<span class="idle">Toca ▶ para empezar</span>'}</div>${hid?'':'<div class="cont" id="cont" hidden></div>'}
  <div class="seek"><span id="tc">0:00</span><input id="sk" type="range" min="0" max="1000" value="0" aria-label="Posición"><span id="td">0:00</span></div>
  <div class="ctrl"><button id="pv" aria-label="Frase anterior">${svg(IC.prev)}</button><button id="pp" class="big" aria-label="Reproducir o pausar">${svg(IC.play)}</button><button id="nx" aria-label="Frase siguiente">${svg(IC.next)}</button></div>
  <div class="ctl"><button class="btn" data-r=".75">0.75×</button><button class="btn on" data-r="1">1×</button><button class="btn" data-r="1.25">1.25×</button><button class="btn" id="loop">↻ Repetir frase</button></div></div>
  <div class="right">${hid?'':`<div class="card nb" id="nb"><div class="nbh"><b>Mi cuaderno</b><span id="nbc"></span></div><div class="nbl" id="nbl"></div><p class="nbm" id="nbm" role="status"></p><div class="add"><input class="in" id="mi" maxlength="200" placeholder="Escribe una palabra o frase" aria-label="Palabra o frase" autocomplete="off" autocapitalize="off"><button class="ib dir" id="dr" aria-label="Cambiar dirección de traducción">⇄ EN→ES</button><button class="ib gold" id="ma" aria-label="Agregar">＋</button></div></div><div class="acts" style="margin-bottom:12px"><button class="btn" id="tt" aria-expanded="false">Ver texto completo</button></div><div class="card tr" id="tr" hidden>${S.map((s,i)=>`<p data-i="${i}">${esc(s.t)}</p>`).join('')}</div>`}
  <div class="acts"><button class="btn main" id="go">${hid?'Ir a las preguntas →':'Siguiente: sin texto →'}</button>${hid?'<button class="btn" id="bk">← Ver texto</button>':''}</div></div></div>`;
  const a=new Audio(cur.src),pg=$('.pg'),st=$('#stage'),cv=$('#cv'),g=cv.getContext&&cv.getContext('2d'),cap=$('#cap'),tr=$('#tr'),cont=$('#cont'),sk=$('#sk');
  a.preload='metadata';
  let idx=-1,loop=false,drag=false,ac=null,an=null,data=null,raf=0,mark=()=>{};
  const fit=()=>{const r=st.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d||300;cv.height=r.height*d||300};fit();addEventListener('resize',fit);
  const boot=()=>{if(!ac){try{const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();const s=ac.createMediaElementSource(a);an=ac.createAnalyser();an.fftSize=128;an.smoothingTimeConstant=.82;s.connect(an);an.connect(ac.destination);data=new Uint8Array(an.frequencyBinCount)}catch(e){an=null}}if(ac&&ac.state==='suspended')ac.resume()};
  const toggle=()=>{boot();a.paused?a.play():a.pause()};
  const sync=()=>{const p=!a.paused;if(cont&&p)cont.hidden=true;pg.classList.toggle('playing',p);$('#pp').innerHTML=svg(p?IC.pause:IC.play)};
  a.onplay=a.onpause=a.onended=sync;
  a.onloadedmetadata=()=>{$('#td').textContent=fmt(a.duration)};
  const show=k=>{idx=k;if(!hid){cap.innerHTML=`<span class="sn">${words(S[k].t)}</span>`;mark();cap.classList.remove('pop');void cap.offsetWidth;cap.classList.add('pop');
    tr.querySelectorAll('p').forEach((p,i)=>p.classList.toggle('now',i===k));const p=tr.children[k];tr.scrollTo({top:p.offsetTop-tr.clientHeight/2+p.clientHeight/2,behavior:'smooth'})}};
  const draw=t=>{
    raf=requestAnimationFrame(draw);
    const ct=a.currentTime,playing=!a.paused;
    if(loop&&idx>-1&&playing&&ct>=S[idx].e-.04){a.currentTime=S[idx].s}
    const k=S.findIndex(s=>ct>=s.s&&ct<s.e);if(k>-1&&k!==idx)show(k);
    if(!drag&&a.duration){sk.value=ct/a.duration*1000}$('#tc').textContent=fmt(ct);
    if(!g)return;
    const W=cv.width,c=W/2,R0=W*.33,L=W*.14,N=72;g.clearRect(0,0,W,W);
    let bass=0;if(an&&playing){an.getByteFrequencyData(data);bass=(data[1]+data[2]+data[3])/765}
    for(let i=0;i<N;i++){
      const m=Math.abs(i-N/2)/(N/2);let v;
      if(an&&playing)v=data[Math.min(data.length-1,(m*data.length*.8)|0)]/255;
      else v=playing?.22+.16*Math.sin(t/170+i*.7):.05+.03*Math.sin(t/700+i*.4);
      const ang=i/N*Math.PI*2-Math.PI/2,len=W*.01+v*L,x=Math.cos(ang),y=Math.sin(ang);
      g.strokeStyle=`hsla(${42+v*8},95%,${54+v*20}%,${.5+v*.5})`;g.lineWidth=W*.011;g.lineCap='round';
      g.beginPath();g.moveTo(c+x*R0,c+y*R0);g.lineTo(c+x*(R0+len),c+y*(R0+len));g.stroke();
    }
    st.style.setProperty('--b',bass.toFixed(3));
  };
  raf=requestAnimationFrame(draw);
  cleanup=()=>{cancelAnimationFrame(raf);a.pause();removeEventListener('resize',fit);try{ac&&ac.close()}catch(e){}};
  $('#pp').onclick=toggle;if(hid)$('#hs').onclick=toggle;
  $('#pv').onclick=()=>{const k=Math.max(0,idx>-1&&a.currentTime-S[idx].s<1?idx-1:idx);a.currentTime=S[k].s};
  $('#nx').onclick=()=>{const k=Math.min(S.length-1,idx+1);a.currentTime=S[k].s};
  sk.onpointerdown=()=>drag=true;sk.onchange=()=>drag=false;sk.onpointerup=()=>drag=false;
  sk.oninput=()=>{if(a.duration)a.currentTime=sk.value/1000*a.duration};
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{a.playbackRate=+b.dataset.r;app.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b))});
  $('#loop').onclick=e=>{loop=!loop;e.currentTarget.classList.toggle('on',loop)};
  if(tr)tr.querySelectorAll('p').forEach((p,i)=>p.onclick=()=>{boot();a.currentTime=S[i].s;a.play()});
  if(!hid){
    const pid=cur.id,nbl=$('#nbl'),nbc=$('#nbc'),nbm=$('#nbm'),mi=$('#mi'),dr=$('#dr'),tt=$('#tt');let dir='en-es',tk=0;
    mark=()=>{const s=new Set(getV(pid).map(x=>x.w.toLowerCase()));cap.querySelectorAll('.wd').forEach(b=>b.classList.toggle('sv',s.has(b.dataset.w.toLowerCase())))};
    const renderNB=()=>{const L=getV(pid);nbc.textContent=L.length+(L.length===1?' palabra':' palabras');
      nbl.innerHTML=L.length?L.slice().reverse().map(x=>entryHTML(x,true,pid)).join(''):'<p class="nbe">Toca una palabra de la frase amarilla.</p>';mark()};
    const add=async(w,ctx,d)=>{
      const L=getV(pid),ex=L.find(x=>x.w.toLowerCase()===w.toLowerCase()&&(x.dir||'en-es')===d);if(ex)return{x:ex,dup:true};
      const x={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),w,tr:[],ctx,dir:d};L.push(x);setV(pid,L);pending.add(x.id);renderNB();
      try{x.tr=await translate(w,d)}catch(e){x.tr=[]}
      pending.delete(x.id);const L2=getV(pid),y=L2.find(z=>z.id===x.id);if(y){y.tr=x.tr;setV(pid,L2)}renderNB();return{x};
    };
    wire(nbl,renderNB);renderNB();
    cap.onclick=async e=>{const b=e.target.closest('.wd');if(!b)return;a.pause();
      const w=b.dataset.w,my=++tk,ctx=idx>-1?S[idx].t:'',say=h=>{if(my===tk)$('#cm').innerHTML=h};
      cont.hidden=false;cont.innerHTML='<p id="cm" role="status"></p><button class="btn main" id="cn">Continuar ▶</button>';
      $('#cn').onclick=()=>{cont.hidden=true;boot();a.play()};
      say(`Traduciendo <b>${esc(w)}</b>…`);
      const r=await add(w,ctx,'en-es');
      say(r.x.tr.length?`<b>${esc(w)}</b> → ${r.x.tr.map(esc).join(' · ')}<i>${r.dup?'Ya estaba en tu cuaderno.':'Guardada en tu cuaderno.'} Revisa la frase: una palabra suelta puede cambiar de sentido.</i>`:`<b>${esc(w)}</b> quedó guardada, pero no pude traducirla ahora (sin conexión o límite diario). Escribe tú la traducción en el cuaderno.`);
    };
    dr.onclick=()=>{dir=dir==='en-es'?'es-en':'en-es';dr.textContent='⇄ '+(dir==='en-es'?'EN→ES':'ES→EN')};
    const manual=async()=>{const v=mi.value.trim();if(!v)return;mi.value='';nbm.textContent='';
      const r=await add(v,'',dir);if(!r.x.tr.length&&!r.dup)nbm.textContent='No pude traducir ahora (sin conexión o límite diario). Guardé la entrada: escribe tú la traducción.'};
    $('#ma').onclick=manual;mi.onkeydown=e=>{if(e.key==='Enter')manual()};
    tt.onclick=()=>{const open=tr.hidden;tr.hidden=!open;tt.textContent=open?'Ocultar texto completo':'Ver texto completo';tt.setAttribute('aria-expanded',open);
      if(open&&idx>-1){const p=tr.children[idx];tr.scrollTo({top:p.offsetTop-tr.clientHeight/2+p.clientHeight/2})}};
  }
  $('#go').onclick=()=>phase(n+1);if($('#bk'))$('#bk').onclick=()=>phase(1);
}

/* ---------- Preguntas: aleatorias, sin repetir hasta agotar el banco ---------- */
function pick(){
  const all=cur.questions.map((_,i)=>i),n=Math.min(cur.quizSize||5,all.length),key='seen:'+cur.id;
  let seen=LS.get(key,[]).filter(i=>i<all.length);const fresh=all.filter(i=>!seen.includes(i));let chosen;
  if(fresh.length>=n){chosen=shuffle(fresh).slice(0,n);seen=seen.concat(chosen)}
  else{chosen=fresh.concat(shuffle(all.filter(i=>!fresh.includes(i))).slice(0,n-fresh.length));seen=[...chosen]}
  LS.set(key,seen);return{ids:shuffle(chosen),left:all.length-seen.length};
}
function quiz(){
  const{ids,left}=pick(),qs=ids.map(i=>{const q=cur.questions[i];return{q:q.q,ok:q.o[q.a],o:shuffle(q.o)}});
  let k=0,score=0,wrong=0,log=[];
  const strikes=()=>`<span class="strikes" title="Errores">Errores <i class="${wrong>0?'x':''}"></i><i class="${wrong>1?'x':''}"></i></span>`;
  const show=()=>{const q=qs[k];
    app.innerHTML=`${steps(3)}<div class="card qwrap"><div class="phase">Paso 3 · ${esc(cur.title)}</div><div class="cnt"><span>Pregunta ${k+1} de ${qs.length}</span>${strikes()}</div><p class="q">${esc(q.q)}</p><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="acts"><button class="btn main" id="nx" hidden></button></div></div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const p=q.o[b.dataset.i],good=p===q.ok;if(good)score++;else wrong++;log.push({q:q.q,p,ok:q.ok,good});
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.o[x.dataset.i]===q.ok)x.classList.add('ok')});
      if(!good)b.classList.add('bad');
      const nx=$('#nx');nx.hidden=false;nx.textContent=wrong>=2?'Continuar':k+1<qs.length?'Siguiente →':'Ver resultado';
      $('.strikes').outerHTML=strikes();
      nx.onclick=()=>{if(wrong>=2)return retry();k++;k<qs.length?show():end()};
    });
  };
  const retry=()=>{let n=7;
    app.innerHTML=`<div class="card qwrap retry"><div class="bx">✗ ✗</div><h2>Dos errores</h2><p>Vamos a escuchar otra vez con el texto para reforzar.<br>Empiezas de nuevo en <b id="cd">${n}</b></p><button class="btn main" id="rt">Volver al inicio ahora</button></div>`;
    tm=setInterval(()=>{n--;$('#cd').textContent=n;if(n<=0)phase(1)},1000);$('#rt').onclick=()=>phase(1)};
  const end=()=>{const pct=Math.round(score/qs.length*100),best=Math.max(pct,LS.get('best:'+cur.id,0));LS.set('best:'+cur.id,best);
    app.innerHTML=`${steps(3)}<div class="card qwrap"><div class="phase">Resultado</div><div class="score">${score}/${qs.length}</div><p>${pct===100?'¡Perfecto! 🔥':'¡Buen trabajo! Repite con preguntas nuevas para seguir entrenando.'}</p>
    <div class="rev">${log.map(l=>`<div class="${l.good?'ok':'bad'}">${l.good?'✓':'✗'} ${esc(l.q)}<small>${l.good?esc(l.ok):'Tu respuesta: '+esc(l.p)+' · Correcta: '+esc(l.ok)}</small></div>`).join('')}</div>
    <div class="acts"><button class="btn main" id="again">Preguntas nuevas</button><button class="btn" id="rl">Escuchar otra vez</button><a class="btn" href="#/" style="text-decoration:none">Más podcasts</a></div>
    <p class="pool">${left>0?`Te quedan ${left} preguntas sin ver en este podcast.`:'Ya viste todas las preguntas. El ciclo se reinicia.'}</p></div>`;
    $('#again').onclick=quiz;$('#rl').onclick=()=>phase(1)};
  show();
}
route();
</script>
