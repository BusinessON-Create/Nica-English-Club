  <div id="s-neclub" class="screen">
    <nav class="stu-nav">
      <div class="brand-link" style="cursor:pointer;" onclick="irArribaFeedNeclub()">
        <div class="nav-logo-box app-logo" style="width:32px; height:32px; border-radius:9px;"></div>
        <span style="color:#fff; font-weight:800; font-size:14.5px; margin-left:9px; letter-spacing:.3px;">NECLUB</span>
      </div>
      <div class="nav-actions">
        <button class="btn-salir" onclick="showScreen('s-student')" title="Volver al panel"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="btn-salir" onclick="irArribaFeedNeclub()" title="Inicio"><i class="fa-solid fa-house"></i></button>
        <div class="notif-wrap">
          <button class="notif-bell-btn" onclick="neclubModoVisitante ? abrirModalEnganche('campana') : toggleNeclubNotifDropdown()" title="Notificaciones de NECLUB">
            <i class="fa-solid fa-bell"></i>
            <span class="notif-badge" id="neclub-notif-badge">0</span>
          </button>
        </div>
        <button class="btn-salir" onclick="neclubModoVisitante ? abrirModalEnganche('mensajes') : abrirChatFlotante()" title="Mensajes"><i class="fa-solid fa-comments"></i><span class="chat-notif-badge">0</span></button>
        <button class="nav-avatar-chip" onclick="neclubModoVisitante ? abrirModalEnganche('perfil') : abrirPerfil()" title="Mi perfil"></button>
      </div>
    </nav>
    <div class="neclub-new-posts-bar" id="neclub-new-posts-bar" onclick="irArribaFeedNeclub()" style="display:none;"><i class="fa-solid fa-arrow-up"></i> New posts</div>
    <div class="neclub-shell" id="neclub-shell">
      <div class="neclub-flashes-wrap" id="neclub-flashes-wrap" style="display:none;"></div>
      <div class="neclub-composer">
        <div class="neclub-composer-row">
          <div class="neclub-avatar" id="neclub-avatar-composer"></div>
          <textarea id="neclub-texto" placeholder="Ask a question, start a debate, share your story... in English!" maxlength="500" oninput="this.style.height='auto'; this.style.height=this.scrollHeight+'px'; actualizarEstadoPublicarNeclub();"></textarea>
        </div>
        <p class="neclub-composer-hint">Posts, photos, videos and audios disappear automatically after 7 days.</p>
        <div class="neclub-preview-wrap" id="neclub-preview-wrap" style="display:none;">
          <button class="neclub-preview-remove" onclick="quitarArchivoNeclub()"><i class="fa-solid fa-xmark"></i></button>
          <div id="neclub-preview-inner"></div>
        </div>
        <input type="file" id="neclub-file-foto" accept="image/*" style="display:none;" onchange="seleccionarArchivoNeclub(event,'foto')">
        <input type="file" id="neclub-file-video" accept="video/*" style="display:none;" onchange="seleccionarArchivoNeclub(event,'video')">
        <input type="file" id="neclub-file-audio" accept="audio/*" style="display:none;" onchange="seleccionarArchivoNeclub(event,'audio')">
        <div class="neclub-composer-actions">
          <div class="neclub-media-btns">
            <label class="neclub-media-btn foto" for="neclub-file-foto" title="Photo"><i class="fa-solid fa-image"></i></label>
            <label class="neclub-media-btn video" for="neclub-file-video" title="Video (max 1 min)"><i class="fa-solid fa-video"></i></label>
            <label class="neclub-media-btn audio" for="neclub-file-audio" title="Audio (max 2 min)"><i class="fa-solid fa-microphone"></i></label>
          </div>
          <button class="neclub-publish-btn" id="neclub-publish-btn" disabled onclick="publicarNeclub()">Post</button>
        </div>
        <div id="neclub-post-progreso-wrap" style="display:none; margin-top:10px; max-width:calc(100% - 52px); margin-left:52px;">
          <div style="background:rgba(255,255,255,.08); border-radius:99px; height:6px; overflow:hidden;">
            <div id="neclub-post-progreso-bar" style="background:linear-gradient(135deg, var(--gold3), var(--gold2)); height:100%; width:0%; transition:width .2s linear;"></div>
          </div>
          <p id="neclub-post-progreso-texto" style="font-size:11px; color:var(--muted-dim); margin-top:5px;">Subiendo... 0%</p>
        </div>
      </div>

      <div id="neclub-feed"></div>
    </div>
  </div>
