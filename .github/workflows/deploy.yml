name: Deploy to GitHub Pages

# Se ejecuta automáticamente en cada push a la rama principal.
# No requiere que edites nada a mano: reemplaza __BUILD_VERSION__
# en index.html por la fecha/hora del build antes de publicar.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish folder
        run: |
          mkdir -p _site
          cp -r . _site
          rm -rf _site/.git _site/.github

      - name: Stamp build version
        run: |
          BUILD_VERSION="$(date -u +'%Y%m%d%H%M%S')"
          echo "Stamping version: $BUILD_VERSION"
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
