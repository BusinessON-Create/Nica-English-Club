<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nica English Club · Karaoke Reader</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root{--g:linear-gradient(135deg,#F5C242,#E8A915);--gold:#F5C242;--line:rgba(255,255,255,.09);--mut:#8b8b8b}
*{-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;
background-image:radial-gradient(60% 40% at 65% 0%,rgba(232,169,21,.10),transparent 70%);background-repeat:no-repeat}
h1,h2,h3{letter-spacing:-.03em;font-weight:800}
.hid{display:none!important}
.lucide{width:18px;height:18px;flex:none}
.card{background:#050505;border:1px solid var(--line);border-radius:22px;padding:16px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:.6rem 1.1rem;font-weight:600;font-size:.85rem;transition:.2s;background:transparent;color:#fff}
.pill:hover{border-color:var(--gold)}
.gold{background:var(--g);color:#000;border-color:transparent;box-shadow:0 6px 24px rgba(232,169,21,.25)}
.gold:hover{filter:brightness(1.08)}
.on-b{border-color:var(--gold);color:var(--gold);background:rgba(245,194,66,.08)}
.sec{font-size:.95rem;display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,textarea,select{background:#000;border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;color:#fff;font-size:16px;width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.7rem .85rem;border:1px solid var(--line);border-radius:14px;font-size:.9rem;color:#bbb;cursor:pointer}
.row.act{border-color:var(--gold);color:#fff;background:rgba(245,194,66,.07)}
.fld{display:flex;align-items:center;justify-content:space-between;gap:.5rem;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:.55rem .9rem;transition:.2s;background:#000}
.fld:hover{border-color:var(--gold)}.fld small{display:block;font-size:.68rem;color:var(--mut)}.fld b{font-size:.9rem;font-weight:700}
.lv{font-size:.65rem;border:1px solid var(--line);border-radius:99px;padding:.05rem .45rem;color:var(--gold);flex:none}
.logo-box{height:40px;display:flex;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:12px;background:#000;overflow:hidden;flex:none}
.logo-box img{height:100%;width:auto;max-width:120px;object-fit:contain}
.vp{position:relative;max-height:min(46vh,280px);overflow-y:auto;text-align:center;padding:.5rem;scrollbar-width:thin;scrollbar-color:#3a3a3a #000}
.words{font-size:clamp(1.35rem,2.6vw,2rem);font-weight:700;line-height:1.7}
.w{display:inline-block;margin:.1em .28em;border-radius:8px;cursor:pointer;transition:color .15s,transform .15s}
.w:hover{color:var(--gold)}
.w.p{color:rgba(255,255,255,.32)}
.w.on{color:var(--gold);font-weight:800;transform:scale(1.1);text-shadow:0 0 18px rgba(245,194,66,.6)}
.w.ok{color:#4ade80}.w.x{color:#f87171}
.bar{height:6px;background:#111;border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
.nd{fill:#000;stroke:rgba(255,255,255,.2);stroke-width:1.5;transition:.4s}.nt{fill:#8b8b8b;font-size:11px;font-weight:700;text-anchor:middle}
.a .nd{fill:#F5C242;stroke:#F5C242;filter:drop-shadow(0 0 8px rgba(245,194,66,.7))}.a .nt{fill:#000}
.d .nd{stroke:#F5C242}.d .nt{fill:#F5C242}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:1rem;backdrop-filter:blur(6px)}
.ov.show{display:flex}
.ov>.card{max-height:92vh;overflow-y:auto}
@media(max-width:639px){.sheet{padding:0;align-items:flex-end}.sheet>.card{border-radius:24px 24px 0 0;max-width:100%;max-height:85vh}}
#cd{position:absolute;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:20;border-radius:22px}
#cd b{font-size:7rem;font-weight:800;background:var(--g);-webkit-background-clip:text;color:transparent;animation:pop .8s ease-out}
@keyframes pop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
.rec{width:8px;height:8px;border-radius:99px;background:#ef4444;animation:bl 1.4s infinite;flex:none}@keyframes bl{50%{opacity:.25}}
#camp{display:none;position:fixed;right:12px;bottom:92px;width:100px;aspect-ratio:3/4;object-fit:cover;border-radius:16px;border:2px solid var(--gold);transform:scaleX(-1);z-index:40;background:#000}
#camp.show{display:block}
@media(min-width:1024px){#camp{bottom:20px;width:150px}}
#stars button{color:#333}#stars button.sf{color:#F5C242}#stars .lucide{width:30px;height:30px}#stars .sf .lucide{fill:#F5C242}
@media(max-width:1023px){.ctl{position:sticky;bottom:0;z-index:30;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);margin:0 -1rem;padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom));border-top:1px solid var(--line)}}
.proj .side,.proj header,.proj .extra{display:none!important}
.proj .words{font-size:clamp(2.2rem,5vw,4.4rem)}.proj .vp{max-height:62vh}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="border-b border-white/10 px-4 py-3">
 <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
  <div class="flex items-center gap-3 min-w-0">
   <span id="lg" class="logo-box hid"><img src="assets/logo.png" alt="Nica English Club" onload="document.getElementById('lg').classList.remove('hid')" onerror="this.parentNode.remove()"></span>
   <div class="min-w-0"><h1 class="text-base leading-tight truncate">Nica English Club</h1><p class="text-xs" style="color:var(--mut)">Karaoke Reader</p></div>
  </div>
  <div class="pill" style="gap:.5rem;max-width:48vw"><span class="rec"></span><i data-lucide="mic"></i><span id="who" class="font-extrabold truncate" style="color:var(--gold)"></span></div>
 </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-4 grid lg:grid-cols-[280px_1fr] gap-4 lg:gap-5">
 <aside class="side">
  <section class="card" style="padding:12px">
   <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-2">
    <button class="fld" onclick="pSheet()"><span class="min-w-0"><small>Participante</small><b id="fpv" class="truncate block"></b></span><i data-lucide="chevron-down"></i></button>
    <button class="fld" onclick="sSheet()"><span class="min-w-0"><small>Lectura</small><b id="fsv" class="truncate block"></b></span><i data-lucide="chevron-down"></i></button>
   </div>
   <div id="rank" class="mt-3 text-xs space-y-1" style="color:var(--mut)"></div>
  </section>
 </aside>

 <section class="flex flex-col gap-4 min-w-0">
  <div class="card relative">
   <div id="cd"><b id="cdn">3</b></div>
   <div class="flex items-center justify-between gap-3 mb-2 text-xs" style="color:var(--mut)">
    <span id="st" class="flex items-center gap-2 min-w-0"></span>
    <span class="flex items-center gap-2"><span id="rb" class="hid flex items-center gap-1.5 font-bold" style="color:#ef4444"><span class="rec"></span>REC</span><span id="msg" style="color:var(--gold)" class="text-right"></span></span>
   </div>
   <div id="vp" class="vp"><div id="words" class="words"></div></div>
   <div class="bar mt-3"><i id="pb"></i></div>
  </div>

  <div class="ctl flex flex-wrap items-center gap-2">
   <div id="recbar" class="hid" style="width:100%;display:flex;align-items:center;gap:.6rem;border:1px solid #ef4444;border-radius:14px;padding:.5rem .75rem;background:rgba(239,68,68,.08)"><span class="rec"></span><b id="rt" style="font-variant-numeric:tabular-nums">00:00</b><span class="text-xs" style="color:#ddd;flex:1">Grabando: lectura + tu cámara</span><button class="pill gold" style="padding:.4rem .9rem" onclick="stopAll()">Terminar y guardar</button></div>
   <button id="play" class="pill gold" onclick="toggle()"></button>
   <button id="stopb" class="pill" onclick="stopAll()"></button>
   <button class="pill" onclick="jump(-1)" aria-label="Oración anterior"><i data-lucide="skip-back"></i></button>
   <button class="pill" onclick="jump(1)" aria-label="Oración siguiente"><i data-lucide="skip-forward"></i></button>
   <button id="recb" class="pill" onclick="toggleRec()"></button>
   <button id="lastv" class="pill hid on-b" onclick="openVM()"></button>
   <button class="pill" onclick="proj()" aria-label="Modo proyector"><i data-lucide="maximize"></i><span class="hidden md:inline">Proyector</span></button>
  </div>

  <div class="extra grid md:grid-cols-[250px_1fr] gap-4">
   <div class="card flex flex-col items-center order-2 md:order-1">
    <svg id="ring" viewBox="0 0 240 240" class="w-full max-w-[230px]" role="img" aria-label="Pasos del método"></svg>
   </div>
   <div class="card flex flex-col gap-4 order-1 md:order-2">
    <div>
     <h3 class="sec">Modo</h3>
     <div class="grid grid-cols-3 gap-2" id="modes"></div>
     <p id="mdesc" class="text-xs mt-2" style="color:var(--mut)"></p>
    </div>
    <div>
     <h3 class="sec">Velocidad</h3>
     <div class="grid grid-cols-3 gap-2" id="speeds"></div>
     <input id="rate" type="range" min=".4" max="1.4" step=".05" value=".8" class="mt-3" style="padding:0" aria-label="Velocidad fina">
    </div>
    <div class="grid sm:grid-cols-[1fr_auto] gap-2 items-center">
     <select id="vsel" aria-label="Voz"></select>
     <button id="vtg" class="pill on-b" onclick="toggleVoice()"><i data-lucide="volume-2"></i>Voz guía</button>
    </div>
    <div class="flex gap-2 flex-wrap">
     <button class="pill" onclick="openCustom()"><i data-lucide="clipboard-paste"></i>Pegar mi lectura</button>
    </div>
    <p class="text-xs hidden md:block" style="color:var(--mut)">Atajos: Espacio inicia o pausa · ← → cambian de oración · toca una palabra para oírla.</p>
   </div>
  </div>
 </section>
</main>

<div id="toast" class="hid" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:80;max-width:92vw;background:#111;border:1px solid var(--gold);color:#fff;border-radius:14px;padding:.6rem 1rem;font-size:.85rem;text-align:center"></div>
<video id="camp" playsinline muted autoplay></video>

<div id="sh" class="ov sheet"><div class="card w-full max-w-md" style="padding:20px">
 <div class="flex items-center justify-between mb-3"><h2 id="shT" class="text-lg"></h2><button onclick="closeSheet()" aria-label="Cerrar" style="color:#aaa"><i data-lucide="x"></i></button></div>
 <div id="shC"></div>
</div></div>

<div id="res" class="ov"><div class="card w-full max-w-md text-center" style="padding:24px;border-color:rgba(245,194,66,.4)">
 <div class="mx-auto mb-3 grid place-items-center w-14 h-14 rounded-full" style="background:var(--g);color:#000"><i data-lucide="trophy" style="width:28px;height:28px"></i></div>
 <h2 class="text-2xl">Lectura completada</h2>
 <p class="text-sm mb-4" style="color:var(--mut)" id="rwho"></p>
 <div class="grid grid-cols-3 gap-2 mb-4" id="rstats"></div>
 <div id="vbox" class="mb-4 text-left"></div>
 <p class="text-sm font-semibold mb-2">Valoración del coach</p>
 <div id="stars" class="flex justify-center gap-1 mb-2"></div>
 <p id="rcom" class="text-sm mb-5 min-h-5" style="color:var(--gold)"></p>
 <div class="flex gap-2"><button class="pill flex-1" onclick="closeRes(0)">Repetir</button><button class="pill gold flex-1" onclick="closeRes(1)">Siguiente</button></div>
</div></div>

<div id="cm" class="ov sheet"><div class="card w-full max-w-xl" style="padding:20px">
 <h2 class="sec text-lg"><i data-lucide="pencil"></i>Tu propia lectura</h2>
 <input id="ct" placeholder="Título" class="mb-3">
 <textarea id="cx" rows="7" placeholder="Escribe o pega un texto en inglés" style="resize:none"></textarea>
 <div class="flex gap-2 mt-4"><button class="pill flex-1" onclick="$('cm').classList.remove('show')">Cancelar</button><button class="pill gold flex-1" onclick="applyCustom()">Cargar texto</button></div>
</div></div>

<script>
const S=[
["The Magic Avocado","A2","You won't believe what happened yesterday! I was walking in my backyard when I found a gigantic avocado. It was as big as a soccer ball! I touched it, and suddenly, it started to glow. Then, a tiny voice from inside said, 'Please do not make guacamole with me, I can talk!' I ran inside to show my grandmother, but when we returned, the avocado was gone! I think it went to the market to find its friends."],
["First Time Eating Quesillo","B1","Let me tell you about my first time eating a real Nicaraguan quesillo in Nagarote. I was sitting at a wooden table when a nice lady brought me a warm corn tortilla filled with white cheese. Then she added a huge spoonful of pickled onions and a giant mountain of cream! When I took the first bite, everything started to slide out. The cream dripped all over my new white shirt! It was a super delicious disaster."],
["The Cat That Wanted to Fly","A1","My neighbor has a crazy black cat named Toby. Toby doesn't like mice. Toby likes airplanes. Every morning, he climbs to the top of our roof and looks at the sky. Yesterday, Toby jumped off the roof to catch a bird! Luckily, he landed inside a big basket of laundry. He looked very confused, but he was safe. Now we call him the pilot cat."],
["A Surprise Party Gone Wrong","B1","Last Saturday, we planned a secret birthday party for our teacher, Mister Jose. We all hid under the desks with balloons and confetti. We waited in the dark for twenty minutes! Suddenly, the door opened and we all jumped out shouting, 'Happy Birthday!' But guess what? It was not Mister Jose! It was the principal, carrying a tall stack of exam papers. She got so scared that she dropped all the papers on the floor."],
["The Missing Homework Mystery","A2","I swear I did my English homework last night! I wrote a beautiful essay about my favorite video games. But this morning, I couldn't find it anywhere. I looked in my schoolbag, under my bed, and even inside the refrigerator. Do you want to know the truth? My baby brother used my homework to make a tiny paper boat, and he sailed it in the kitchen sink! Now my homework is wet and ruined."],
["An Adventure in Ometepe","B1","Last year, my family traveled to Ometepe Island on a big ferry. The wind was blowing so hard that the water splashed our faces. We rented some bicycles to explore the green forest. While we were riding, we saw a family of monkeys in a mango tree! They were throwing little mangoes at us and laughing. One mango almost hit my dad's head! It was the best day ever."],
["The Talking Dog","A2","I met a very strange golden retriever at the park yesterday. He was sitting on a bench, watching people walk by. I walked up to him and joked, 'Hey buddy, how is your day?' Suddenly, the dog looked up, sighed, and whispered, 'Too much traffic, my friend.' I was so shocked that my ice cream fell out of my hand! When I looked again, the dog was just barking at a squirrel, like a normal dog."],
["The Great Ice Cream Disaster","B1","It was a very hot afternoon in Leon, so I bought a double chocolate ice cream cone. I was so excited! But just as I opened my mouth, a giant yellow butterfly flew straight into my face. I got scared, jumped back, and the ice cream flew out of my hand! It landed on top of a sleeping street dog's back. The dog woke up, looked happy, and ate the ice cream in one second."],
["Lost at Gigante Beach","B1","We went camping at Gigante Beach last weekend. Late at night, my cousin and I decided to look for blue crabs with a flashlight. We walked and walked along the shore. Suddenly, our flashlight died! It was completely dark. We didn't know where our camp was. Luckily, my uncle started playing his acoustic guitar, and we followed the music back to our campfire."],
["The Day My Alarm Didn't Ring","B1","Oh no! Yesterday was a total nightmare! I had an important English exam at eight in the morning. I set three alarms on my phone. But guess what? My phone ran out of battery during the night! I woke up at exactly eight thirty. I jumped out of bed, put my shoes on the wrong feet, and ran to school like crazy. Luckily, my teacher was late too, so I made it on time!"],
["A Secret in the Backyard","B2","My grandfather always told me there was a pirate treasure buried in our backyard. Yesterday, I took a shovel and decided to find it. I dug a big, deep hole near the old mango tree. After one hour of hard work, my shovel hit something hard! I was so excited. I carefully pulled out a dusty metal box and opened it slowly, but there was no gold. It was just my dad's old toy cars from nineteen ninety!"],
["The Library Ghost","B1","Our school library is very old and mysterious. Some students say a friendly ghost lives behind the history books. Yesterday, I was studying alone in the corner. Suddenly, a heavy dictionary flew off the shelf and landed on the table next to me! It was open to a page with the word 'hello' circled in yellow pencil. I didn't run away. I just said, 'Hello back!' and kept studying."],
["My Grandpa's Magical Guitar","B1","My grandfather has an old wooden guitar that he brought from Masaya. He says it has a magical spirit inside. Every time he plays a song, all the birds in the garden stop flying and sit on our window to listen. One night, I tried to play it myself. I played some very bad notes, and suddenly, all the street dogs started howling! I guess the magic only works for him."],
["The Day It Rained Chocolate","A2","Imagine waking up, looking out the window, and seeing brown liquid falling from the sky. Yes! That really happened in my dream last night. It was raining warm chocolate syrup! Everyone in town ran outside with big mugs and spoons. We were dancing in the street and drinking delicious chocolate rain. When I woke up this morning, my face was wet. Oh, it was just my puppy licking me!"],
["Trip to Corn Island","B1","Visiting Corn Island is like stepping into a beautiful movie. The ocean is so clear that you can see tiny colorful fish swimming near your feet. I went snorkeling and saw a friendly green sea turtle! She swam next to me for five minutes. I felt like a real ocean explorer. At night, we ate delicious coconut bread and danced on the white sand under a sky full of bright stars."],
["The Smart Parrot","A1","My aunt has a very smart parrot named Paco. Paco doesn't say hello like other birds. He speaks English! When someone comes in, Paco says, 'How are you doing today?' If you don't answer, he says, 'Wake up, sleepy head!' Yesterday, he joined our online English class and answered three questions correctly. The teacher was so surprised that she gave him an A!"],
["Soccer in the Rain","B1","We were playing the final match of our neighborhood soccer tournament when a big storm started. The field became a giant pool of brown mud. But we didn't stop playing! It was so much fun to slide on the wet grass. In the last minute, I kicked the ball, slipped in a puddle, and landed flat on my back. But the ball went straight into the goal! We won the match, covered in mud."],
["Saving the Birthday Cake","B2","It was my sister's eighth birthday, and my mom had made a beautiful strawberry cake. She put it on the dining table and went to get the candles. Suddenly, our fat dog Sparky walked into the room and stared at the cake! He was getting ready to jump. I ran across the room like a superhero, slid under the table, and caught the dog in mid air! The cake was saved, and I became a hero."],
["The Alien in My Garden","A2","I was looking at the stars last Tuesday when a small, round spaceship landed in our garden. It made no sound at all. A tiny blue alien with three eyes stepped out. He pointed at our lime tree and asked, 'Are these green candies?' I laughed and gave him a fresh yellow lemon instead. He took a bite, made a funny face because it was sour, and flew back to space!"],
["Masaya Market Adventure","B2","If you want to experience real magic, you have to visit the Masaya artisan market. It is full of bright colors, handmade hammocks, and beautiful wooden masks. Last month, I went there to buy a souvenir. I was talking to an old wood carver when he showed me a small wooden whistle. When I blew it, it sounded exactly like a guardabarranco bird! It was the coolest thing I have ever bought."]
].map(([title,lv,text])=>({title,lv,text}));

const $=id=>document.getElementById(id),ic=n=>`<i data-lucide="${n}"></i>`,rf=()=>window.lucide&&lucide.createIcons();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const STEPS=["Situación","Comprender","Escuchar","Repetir","Usar","Corregir","Volver a usar"];
const MODES={listen:["ear","Escuchar","La voz lee y el karaoke la sigue. Sin voz guía, lees tú al ritmo del karaoke.",2],repeat:["repeat","Repetir","La voz dice una oración y tú la repites antes de seguir.",3],challenge:["mic","Reto","Lee tú solo: el micrófono marca cada palabra en verde o rojo.",4]};
const SPD={slow:["turtle","Lento",.6],medium:["bird","Guardabarranco",.8],fast:["cat","Jaguar",1]};

let P=ld('nec_p',[]),SC=ld('nec_s',{}),pi=Math.min(0,P.length-1),story=S[0],lvl='Todos';
let W=[],SE=[],E=[],cur=-1,last=-1,playing=false,run=0,tm=[],iv=null,rec=null,mode='listen',voiceOn=false,res=[],t0=0,voice=null,stars=0,step=0,rstat={};
let R={},V={},recOn=false;
const synth=window.speechSynthesis,rate=()=>+$('rate').value;
const later=(f,ms)=>{const t=setTimeout(f,ms);tm.push(t);return t};
const say=t=>{$('msg').textContent=t||''};
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.remove('hid');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hid'),4500)};
const who=()=>P[pi]||'Invitado';

/* ---------- Anillo de 7 pasos ---------- */
function buildRing(){
 let h=`<defs><linearGradient id="gg"><stop offset="0" stop-color="#F5C242"/><stop offset="1" stop-color="#E8A915"/></linearGradient></defs>
 <circle cx="120" cy="120" r="88" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"/>
 <circle id="arc" cx="120" cy="120" r="88" fill="none" stroke="url(#gg)" stroke-width="4" stroke-linecap="round" transform="rotate(-90 120 120)" stroke-dasharray="553" stroke-dashoffset="553" style="transition:stroke-dashoffset .6s"/>`;
 STEPS.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/7;h+=`<g id="n${i}"><title>${n}</title><circle class="nd" cx="${120+88*Math.cos(a)}" cy="${120+88*Math.sin(a)}" r="13"/><text class="nt" x="${120+88*Math.cos(a)}" y="${124+88*Math.sin(a)}">${i+1}</text></g>`});
 h+=`<text id="rc" x="120" y="112" text-anchor="middle" fill="#8b8b8b" font-size="10"></text><text id="rn" x="120" y="134" text-anchor="middle" fill="#fff" font-size="17" font-weight="800"></text>`;
 $('ring').innerHTML=h;setStep(0);
}
function setStep(i){step=i;STEPS.forEach((_,k)=>$('n'+k).setAttribute('class',k<i?'d':k==i?'a':''));
 $('arc').style.strokeDashoffset=553*(1-i/7);$('rc').textContent=`Paso ${i+1} de 7`;$('rn').textContent=STEPS[i]}

/* ---------- Hoja inferior (selectores) ---------- */
function sheet(t,h){$('shT').textContent=t;$('shC').innerHTML=h;$('sh').classList.add('show');rf()}
const closeSheet=()=>{$('sh').classList.remove('show');$('shC').innerHTML=''};
$('sh').addEventListener('click',e=>{if(e.target===$('sh'))closeSheet()});

/* ---------- Participantes ---------- */
function renderP(){
 $('fpv').innerHTML=P[pi]?esc(P[pi]):'<span style="color:var(--mut);font-weight:600">Elegir participante</span>';
 $('who').textContent=who();
 const top=Object.entries(SC).sort((a,b)=>b[1].best-a[1].best).slice(0,3);
 $('rank').innerHTML=top.length?'<p class="font-semibold text-white mb-1">Ranking de la sesión</p>'+top.map((e,i)=>`<div class="flex justify-between gap-2"><span class="truncate">${i+1}. ${esc(e[0])}</span><span style="color:var(--gold)" class="flex-none">${e[1].best} pts · ${e[1].n}x</span></div>`).join(''):'';
}
function pSheet(){
 sheet('Participantes',`<form onsubmit="addP(event)" class="flex gap-2 mb-3"><input id="pn" placeholder="Nombre del participante" maxlength="24" autocomplete="off" required><button class="pill gold" style="white-space:nowrap">${ic('plus')}Agregar</button></form>`
 +(P.length?`<div class="space-y-2">${P.map((n,i)=>`<div class="row ${i==pi?'act':''}" onclick="pickP(${i})"><span class="truncate">${esc(n)}</span><button onclick="event.stopPropagation();delP(${i})" aria-label="Quitar" style="color:#777">${ic('trash-2')}</button></div>`).join('')}</div>`+(P.length>1?`<button class="pill w-full mt-3" onclick="rndP()">${ic('dices')}Elegir al azar</button>`:''):`<p class="text-sm" style="color:var(--mut)">Aún no hay participantes. Escribe un nombre y toca Agregar.</p>`));
}
function addP(e){e.preventDefault();const v=$('pn').value.trim();if(!v)return;P.push(v);pi=P.length-1;sv('nec_p',P);renderP();pSheet();$('pn').focus()}
function pickP(i){pi=i;renderP();closeSheet()}
function delP(i){P.splice(i,1);pi=Math.max(Math.min(pi,P.length-1),0);sv('nec_p',P);renderP();pSheet()}
function rndP(){let r;do r=Math.random()*P.length|0;while(r==pi);pickP(r)}

/* ---------- Lecturas ---------- */
function renderS(){$('fsv').innerHTML=`${esc(story.title)} <span class="lv">${story.lv}</span>`}
function sSheet(){
 sheet('Lecturas',`<div class="flex gap-1.5 mb-3 flex-wrap">${['Todos','A1','A2','B1','B2'].map(l=>`<button class="pill ${l==lvl?'on-b':''}" style="padding:.3rem .8rem;font-size:.78rem" onclick="lvl='${l}';sSheet()">${l}</button>`).join('')}</div>
 <div class="space-y-2">${S.map((s,i)=>(lvl=='Todos'||s.lv==lvl)?`<div class="row ${s===story?'act':''}" onclick="pickS(${i})"><span class="truncate">${i+1}. ${s.title}</span><span class="lv">${s.lv}</span></div>`:'').join('')}</div>`);
}
function pickS(i){load(S[i]);setStep(0);closeSheet()}
function load(s){
 halt();discardRec();story=s;W=[];SE=[];
 s.text.replace(/\s+/g,' ').match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g).forEach(x=>{const w=x.trim().split(' ');if(w[0]){SE.push([W.length,W.length+w.length-1]);W.push(...w)}});
 $('words').innerHTML='';E=W.map((w,i)=>{const e=document.createElement('span');e.className='w';e.textContent=w;e.onclick=()=>sayWord(i);$('words').appendChild(e);return e});
 cur=last=-1;res=[];$('pb').style.width='0';$('vp').scrollTop=0;
 $('st').innerHTML=`${ic('book-open')}<b class="truncate" style="color:#fff">${esc(s.title)}</b>`;say('');renderS();ui();
}
function applyCustom(){const t=$('cx').value.trim();if(!t){$('cx').placeholder='Escribe o pega un texto primero';return}
 load({title:$('ct').value.trim()||'Mi lectura',lv:'Mío',text:t});setStep(0);$('cm').classList.remove('show')}
function openCustom(){$('ct').value=$('cx').value='';$('cm').classList.add('show')}

/* ---------- Modo, velocidad, voz ---------- */
function renderCtl(){
 const b='style="flex-direction:column;gap:.2rem;border-radius:16px;padding:.6rem .3rem"';
 $('modes').innerHTML=Object.entries(MODES).map(([k,v])=>`<button class="pill ${k==mode?'on-b':''}" ${b} onclick="setMode('${k}')">${ic(v[0])}<span class="text-xs">${v[1]}</span></button>`).join('');
 $('speeds').innerHTML=Object.entries(SPD).map(([k,v])=>`<button class="pill ${rate()==v[2]?'on-b':''}" ${b} onclick="setRate(${v[2]})">${ic(v[0])}<span class="text-xs">${v[1]}</span></button>`).join('');
 $('mdesc').textContent=MODES[mode][2];$('vtg').classList.toggle('on-b',voiceOn||mode=='repeat');rf();
}
function setMode(m){halt();mode=m;renderCtl();setStep(MODES[m][3]);if(m!='listen'&&last>-1)resetRead()}
function setRate(v){$('rate').value=v;rateChanged()}
function rateChanged(){renderCtl();if(playing){halt();go()}}
$('rate').oninput=rateChanged;
function toggleVoice(){if(mode=='repeat')return;const was=playing;halt();voiceOn=!voiceOn;renderCtl();if(was)go()}
function loadVoices(){const v=synth.getVoices().filter(x=>/^en/i.test(x.lang));
 $('vsel').innerHTML=v.map(x=>`<option value="${esc(x.name)}">${esc(x.name)} (${x.lang})</option>`).join('')||'<option>Voz predeterminada</option>';
 const pref=v.find(x=>x.lang=='en-US'&&/google|natural|samantha/i.test(x.name))||v.find(x=>x.lang=='en-US')||v[0];
 if(pref)$('vsel').value=pref.name;voice=pref||null}
$('vsel').onchange=()=>{voice=synth.getVoices().find(x=>x.name==$('vsel').value)||null;if(playing){halt();go()}};
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}

/* ---------- Resaltado ---------- */
function hlTo(i){E.forEach((e,k)=>e.className='w'+(k<i?' p':k==i?' on':''));last=cur=i;prog()}
function hl(i){
 for(let k=Math.max(last,0);k<i;k++)E[k].className='w p';
 if(E[i]){E[i].className='w on';$('vp').scrollTo({top:E[i].offsetTop-$('vp').clientHeight/2+12,behavior:'smooth'})}
 last=cur=i;prog();
}
const prog=()=>$('pb').style.width=((cur+1)/W.length*100)+'%';
const sentOf=i=>{for(let s=0;s<SE.length;s++)if(i<=SE[s][1])return s;return SE.length-1};
function resetRead(){cur=last=-1;res=[];E.forEach(e=>e.className='w');$('pb').style.width='0'}

/* ---------- Motor: la voz es el reloj ---------- */
function speak(si,from){
 const id=++run,s=SE[si];from=Math.max(from,s[0]);
 const ws=W.slice(from,s[1]+1),offs=[];let t='';ws.forEach(w=>{offs.push(t.length);t+=w+' '});
 const u=new SpeechSynthesisUtterance(t.trim());u.lang='en-US';u.rate=rate();if(voice)u.voice=voice;
 let got=false;
 const finish=()=>{if(id!==run)return;hl(s[1]);
  if(mode=='repeat'){say('Tu turno: repite la oración');later(()=>{say('');nextSent(si)},900+ws.length*450/rate())}else nextSent(si)};
 u.onstart=()=>later(()=>{if(id!==run||got)return;
  const tot=ws.length*60000/(165*rate()),len=t.length;
  offs.forEach((o,k)=>later(()=>{if(id===run)hl(from+k)},tot*o/len))},700);
 u.onboundary=e=>{if(id!==run||(e.name&&e.name!=='word'))return;got=true;let k=0;while(k+1<offs.length&&offs[k+1]<=e.charIndex)k++;hl(from+k)};
 u.onend=finish;
 u.onerror=e=>{if(id!==run||/cancel|interrupt/.test(e.error))return;finish()};
 synth.cancel();synth.speak(u);
}
function nextSent(si){if(!playing)return;si+1<SE.length?speak(si+1,SE[si+1][0]):done()}
function timerRead(){const ms=60000/(120*rate());iv=setInterval(()=>{cur+1<W.length?hl(cur+1):done()},ms)}

/* ---------- Reto: reconocimiento de voz ---------- */
const norm=w=>w.toLowerCase().replace(/[^a-z0-9']/g,'');
function challenge(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){say('Este navegador no reconoce voz. Usa Chrome.');playing=false;ui();return}
 rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;let seen={};
 const mark=()=>{E.forEach(e=>e.classList.remove('on'));if(E[cur+1])E[cur+1].classList.add('on')};
 if(cur<=-1)resetRead();mark();say('Escuchando… lee en voz alta');
 rec.onstart=()=>{seen={}};
 rec.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++){
  const r=ev.results[i],ws=norm(r[0].transcript).split(/\s+/).filter(Boolean),lim=r.isFinal?ws.length:ws.length-1;
  for(let k=seen[i]||0;k<lim;k++){let j=-1;
   for(let a=cur+1;a<=cur+4&&a<W.length;a++)if(norm(W[a])==ws[k]){j=a;break}
   if(j>-1){for(let m=cur+1;m<j;m++){res[m]=0;E[m].className='w x'}res[j]=1;E[j].className='w ok';cur=last=j;prog()}}
  seen[i]=Math.max(seen[i]||0,lim)}
  mark();if(cur>=W.length-1)done()};
 rec.onerror=e=>{if(e.error=='not-allowed'){say('Permite el micrófono para jugar el Reto');halt()}};
 rec.onend=()=>{if(playing&&mode=='challenge')try{rec.start()}catch{}};
 try{rec.start()}catch{}
}

/* ---------- Control ---------- */
function ui(){const rc=!!R.mr;$('stopb').innerHTML=ic(rc?'save':'square')+'<span class="'+(rc?'':'hidden sm:inline')+'">'+(rc?'Terminar':'Detener')+'</span>';$('play').innerHTML=playing?ic('pause')+'<span>Pausar</span>':ic('play')+'<span>'+(cur>-1?'Continuar':'Iniciar')+'</span>';rf()}
function halt(){playing=false;run++;try{synth&&synth.cancel()}catch{}tm.forEach(clearTimeout);tm=[];clearInterval(iv);
 if(rec){rec.onend=null;try{rec.stop()}catch{}rec=null}
 if(R.mr&&R.mr.state==='recording')try{R.mr.pause()}catch{}
 ui()}
function go(){
 playing=true;ui();setStep(MODES[mode][3]);if(cur<=-1)t0=Date.now();
 if(R.mr){try{R.mr.state==='inactive'?R.mr.start(1000):R.mr.state==='paused'&&R.mr.resume()}catch{}$('rb').classList.remove('hid');$('recbar').classList.remove('hid');say('Grabando… toca Terminar para guardar')}
 if(mode=='challenge')return challenge();
 if(mode=='repeat'||(voiceOn&&synth)){speak(sentOf(cur+1),cur+1)}else timerRead();
}
async function toggle(){
 if(playing)return halt();
 if(cur>=W.length-1)resetRead();
 if(cur>-1){if(recOn&&!R.mr&&!await prepRec())return;return go()}
 if(recOn&&!R.mr&&!await prepRec())return;
 countdown(go);
}
async function stopAll(){
 const rcd=R.mr&&R.mr.state!=='inactive'&&cur>-1;halt();
 if(rcd){const b=await finishRec();resetRead();say('');ui();b?openVM():toast('No se pudo guardar el video. Prueba en Chrome o Safari actualizados y con https.');return}
 discardRec();resetRead();say('');ui()}
function jump(d){if(!W.length)return;const was=playing;halt();const si=Math.min(Math.max(sentOf(Math.max(cur,0))+d,0),SE.length-1);hlTo(SE[si][0]-1);if(was)go()}
function sayWord(i){if(playing||!synth)return;setStep(1);const u=new SpeechSynthesisUtterance(W[i].replace(/[^\w']/g,''));u.lang='en-US';u.rate=Math.min(rate(),1);if(voice)u.voice=voice;synth.cancel();synth.speak(u)}
function proj(){document.body.classList.toggle('proj');const d=document.documentElement;
 if(document.body.classList.contains('proj'))d.requestFullscreen&&d.requestFullscreen().catch(()=>{});else document.fullscreenElement&&document.exitFullscreen()}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('proj')});
document.addEventListener('keydown',e=>{
 if(e.key=='Escape'){document.body.classList.remove('proj');closeSheet();return}
 if(/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)||document.querySelector('.ov.show'))return;
 if(e.code=='Space'){e.preventDefault();toggle()}else if(e.key=='ArrowRight')jump(1);else if(e.key=='ArrowLeft')jump(-1)});

function beep(f){try{const c=beep.c||(beep.c=new AudioContext()),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.25)}catch{}}
function countdown(cb){let n=3;const o=$('cd'),b=$('cdn');o.style.display='flex';
 const t=()=>{if(n==0){o.style.display='none';return cb()}b.textContent=n;b.style.animation='none';b.offsetWidth;b.style.animation='';beep(n==1?880:440);n--;setTimeout(t,800)};t()}

/* ---------- Grabación de video (lectura + cámara flotante) ---------- */
const MIMES=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
function renderRec(){$('recb').className='pill '+(recOn?'on-b':'');$('recb').innerHTML=ic(recOn?'circle-dot':'video')+'<span>Grabar</span>';rf()}
function toggleRec(){
 if(!window.MediaRecorder||!navigator.mediaDevices){toast('Este navegador no puede grabar. Usa Chrome o Safari actualizados.');return}
 recOn=!recOn;if(!recOn)discardRec();renderRec();
 toast(recOn?'Grabar activado: se graba desde Iniciar hasta el final. Al terminar aparece tu video para descargar.':'Grabación desactivada');
}
async function prepRec(){
 let s;
 try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:{echoCancellation:true,noiseSuppression:true}})}
 catch{try{s=await navigator.mediaDevices.getUserMedia({audio:true});toast('Sin cámara: se grabará la lectura con tu audio')}
  catch{toast('Permite el micrófono y la cámara para grabar');recOn=false;renderRec();return false}}
 const mime=MIMES.find(m=>MediaRecorder.isTypeSupported(m));
 if(!mime){s.getTracks().forEach(t=>t.stop());toast('Este navegador no puede crear el video');return false}
 const v=$('camp'),hasV=s.getVideoTracks().length>0;
 if(hasV){v.srcObject=s;v.classList.add('show');try{await v.play()}catch{}}
 try{await document.fonts.load("700 40px 'Plus Jakarta Sans'")}catch{}
 const cv=document.createElement('canvas'),por=innerHeight>innerWidth*1.1;cv.width=por?720:1280;cv.height=por?1280:720;
 R={s,v,hasV,cv,cx:cv.getContext('2d'),mime,chunks:[],sy:0,por,logo:null};
 const lg=document.querySelector('#lg img');if(lg&&lg.naturalWidth&&location.protocol!='file:')R.logo=lg;
 layout();
 const out=cv.captureStream(30);s.getAudioTracks().forEach(t=>out.addTrack(t));
 R.mr=new MediaRecorder(out,{mimeType:mime,videoBitsPerSecond:3e6});
 R.mr.ondataavailable=e=>{if(e.data.size)R.chunks.push(e.data)};R.mr.onerror=()=>toast('Error al grabar el video');
 R.draw=setInterval(drawFrame,1000/30);ui();return true;
}
function layout(){
 const c=R.cx,Wc=R.cv.width,Hc=R.cv.height,por=R.por;
 R.fs=por?54:42;R.lh=R.fs*1.5;c.font=`700 ${R.fs}px 'Plus Jakarta Sans',sans-serif`;
 const maxW=Wc-(por?90:160),sp=c.measureText(' ').width*1.15,lines=[];let ln={w:[],width:0};R.lineOf=[];
 W.forEach((w,i)=>{const m=c.measureText(w).width;if(ln.w.length&&ln.width+sp+m>maxW){lines.push(ln);ln={w:[],width:0}}ln.width+=(ln.w.length?sp:0)+m;ln.w.push({i,m})});
 lines.push(ln);
 lines.forEach((l,li)=>{let x=(Wc-l.width)/2;l.w.forEach(o=>{o.x=x;x+=o.m+sp;R.lineOf[o.i]=li})});
 R.lines=lines;
 const cw=por?Wc*.4:Wc*.26,ch=por?cw*4/3:cw*3/4;R.cam={x:Wc-cw-32,y:Hc-ch-40,w:cw,h:ch};
 R.top=por?150:130;R.bot=R.cam.y-20;
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawFrame(){
 const c=R.cx;if(!c)return;if(R.mr&&R.mr.state==='recording'){R.el=(R.el||0)+1/30;const t=Math.floor(R.el);$('rt').textContent=String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}const cv=R.cv,Wc=cv.width,Hc=cv.height,cam=R.cam,F="'Plus Jakarta Sans',sans-serif";
 c.shadowBlur=0;c.globalAlpha=1;c.fillStyle='#000';c.fillRect(0,0,Wc,Hc);
 const g=c.createRadialGradient(Wc*.7,0,0,Wc*.7,0,Hc*.7);g.addColorStop(0,'rgba(232,169,21,.2)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,Wc,Hc);
 c.textBaseline='alphabetic';c.textAlign='left';let hx=40;
 if(R.logo){const h=46,w=h*R.logo.naturalWidth/R.logo.naturalHeight;c.drawImage(R.logo,40,34,w,h);hx+=w+14}
 c.fillStyle='#fff';c.font='800 30px '+F;c.fillText('Nica English Club',hx,66);
 c.fillStyle='#F5C242';c.font='600 22px '+F;c.fillText(who()+' · '+story.title,40,106);
 R.sy+=((R.lineOf[Math.max(cur,0)]||0)-R.sy)*.12;
 const mid=(R.top+R.bot)/2;c.save();c.beginPath();c.rect(0,R.top,Wc,R.bot-R.top);c.clip();
 c.font=`700 ${R.fs}px `+F;c.textBaseline='middle';
 R.lines.forEach((l,li)=>{const y=mid+(li-R.sy)*R.lh;if(y<R.top-R.lh||y>R.bot+R.lh)return;
  c.globalAlpha=Math.max(.2,1-Math.abs(li-R.sy)*.3);
  l.w.forEach(o=>{const k=E[o.i].classList;c.shadowBlur=0;
   if(k.contains('on')){c.fillStyle='#F5C242';c.shadowColor='#F5C242';c.shadowBlur=24}
   else c.fillStyle=k.contains('ok')?'#4ade80':k.contains('x')?'#f87171':k.contains('p')?'rgba(255,255,255,.4)':'#fff';
   c.fillText(W[o.i],o.x,y)})});
 c.restore();c.shadowBlur=0;c.globalAlpha=1;
 c.fillStyle='#F5C242';c.fillRect(0,Hc-8,Wc*(cur+1)/W.length,8);
 if(R.hasV&&R.v.readyState>=2){
  const{x,y,w,h}=cam,vw=R.v.videoWidth,vh=R.v.videoHeight,s=Math.max(w/vw,h/vh),sw=w/s,sh=h/s;
  c.save();c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=30;rr(c,x,y,w,h,28);c.fillStyle='#000';c.fill();c.shadowBlur=0;c.clip();
  c.translate(x+w,y);c.scale(-1,1);c.drawImage(R.v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,w,h);c.restore();
  c.strokeStyle='#F5C242';c.lineWidth=4;rr(c,x,y,w,h,28);c.stroke();
 }
}
function cleanupCam(){clearInterval(R.draw);if(R.s)R.s.getTracks().forEach(t=>t.stop());const v=$('camp');v.srcObject=null;v.classList.remove('show');$('rb').classList.add('hid');$('recbar').classList.add('hid');R={};ui()}
function discardRec(){if(R.mr&&R.mr.state!=='inactive'){R.mr.onstop=null;try{R.mr.stop()}catch{}}if(R.cv)cleanupCam()}
function stopRec(){return new Promise(r=>{const m=R.mr;if(!m){return r(null)}
 if(m.state==='inactive'){cleanupCam();return r(null)}
 const chunks=R.chunks,mime=R.mime;m.onstop=()=>{cleanupCam();r(chunks.length?new Blob(chunks,{type:mime.split(';')[0]}):null)};m.stop()})}
function dl(){if(!V.blob)return;const a=document.createElement('a');a.href=V.url;a.download=V.name;document.body.appendChild(a);a.click();a.remove()}
async function shareV(){const f=new File([V.blob],V.name,{type:V.blob.type});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Mi lectura'})}catch{}}else dl()}

async function finishRec(){const had=!!R.mr,b=await finishRec();$('vbox').innerHTML=b?vidHTML():'';if(had&&!b)toast('No se pudo guardar el video. Prueba en Chrome o Safari actualizados y con https.');
 $('rwho').textContent=who();
 const st=(i,l)=>`<div class="card" style="padding:12px"><div class="text-xl font-extrabold" style="color:var(--gold)">${i}</div><div class="text-xs" style="color:var(--mut)">${l}</div></div>`;
 $('rstats').innerHTML=st(rstat.wpm,'palabras/min')+st(rstat.acc==null?'—':rstat.acc+'%','precisión')+st(W.length,'palabras');
 setStars(0);$('res').classList.add('show');rf();
}
const COM=["Califica la lectura","Buen intento, sigue practicando.","Vas bien, cuida el ritmo.","Excelente, pronunciación clara.","Espectacular, casi nativo.","Increíble, el micrófono es tuyo."];
function setStars(n){stars=n;$('stars').innerHTML=[1,2,3,4,5].map(i=>`<button onclick="setStars(${i})" aria-label="${i} estrellas" class="${i<=n?'sf':''}">${ic('star')}</button>`).join('');$('rcom').textContent=COM[n];rf()}
function closeRes(next){
 const name=who(),pts=rstat.acc!=null?rstat.acc:stars*20,o=SC[name]||{best:0,n:0};
 SC[name]={best:Math.max(o.best,pts),n:o.n+1};sv('nec_s',SC);$('res').classList.remove('show');
 if(next&&P.length>1)pi=(pi+1)%P.length;
 if(next){let s;do s=S[Math.random()*S.length|0];while(s===story);load(s)}else{resetRead();ui()}
 setStep(6);renderP();
}

/* ---------- Inicio ---------- */
buildRing();renderCtl();renderRec();renderP();load(story);rf();
const li=document.querySelector('#lg img');if(li&&li.complete&&li.naturalWidth)$('lg').classList.remove('hid');
</script>
