<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico - Nica English Club</title>
<style>
  body{font-family:Arial,sans-serif;background:#111;color:#eee;margin:0;padding:16px;font-size:15px}
  h1{font-size:18px;margin:0 0 12px}
  button{background:#fff;color:#111;border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;margin:6px 0}
  pre{background:#000;border:1px solid #333;border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word;font-size:13px}
  .ok{color:#7CFC8A}.bad{color:#ff8a80}.warn{color:#ffd27c}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
<h1>Diagnóstico de conexión</h1>
<button id="run">1) Probar conexión</button><br>
<button id="login">2) Iniciar sesión y probar con mi cuenta</button>
<pre id="out">Toca el botón 1 primero.</pre>

<script>
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbx43kRtZ7ySNqqe1VxhEUFCJikVhIgdkVI15Y3FsF4JgKAxHX3R-bLxYrJ13mjUk6OT/exec";
firebase.initializeApp({
  apiKey: "AIzaSyCchgmeTjQdvsBzOJ9MWH6eJryvG83utAA",
  authDomain: "nicaenglishportal.firebaseapp.com",
  projectId: "nicaenglishportal"
});

const out = document.getElementById('out');
const log = (t, cls)=>{ out.innerHTML += '\n' + (cls ? '<span class="'+cls+'">'+t+'</span>' : t); };
const esc = s => String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function jsonp(url, ms){
  return new Promise(resolve=>{
    const cb = '__dx_' + Date.now();
    const s = document.createElement('script');
    let done = false;
    const end = (r)=>{ if(done) return; done = true; clearTimeout(t); delete window[cb]; s.remove(); resolve(r); };
    const t = setTimeout(()=>end({status:'timeout'}), ms || 20000);
    window[cb] = d => end({status:'ok', data:d});
    s.onerror = ()=>end({status:'error'});
    s.onload  = ()=>setTimeout(()=>end({status:'cargó pero no respondió JSON (probable página de error de Google)'}), 300);
    s.src = url + (url.indexOf('?')>-1?'&':'?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}

async function testFetch(token){
  const url = SHEETS_URL + (token ? '?token=' + encodeURIComponent(token) : '');
  try{
    const r = await fetch(url, {credentials:'omit', redirect:'follow'});
    const txt = await r.text();
    try{
      const j = JSON.parse(txt);
      const shown = j.ok ? 'ok:true (versión ' + j.version + ', alumnos: ' + (j.students||[]).length + ', historial: ' + (j.history||[]).length + ')' : JSON.stringify(j);
      log('fetch sin cookies → HTTP ' + r.status + ' → ' + esc(shown), j.ok ? 'ok' : (j.error==='auth' && !token ? 'ok' : 'bad'));
      return j;
    }catch(e){
      log('fetch sin cookies → HTTP ' + r.status + ' pero NO es JSON. Inicio de la respuesta: ' + esc(txt.slice(0,150)), 'bad');
    }
  }catch(e){
    log('fetch sin cookies → FALLÓ: ' + esc(e.message || e), 'bad');
  }
  return null;
}

async function testJsonp(token){
  const url = SHEETS_URL + (token ? '?token=' + encodeURIComponent(token) : '');
  const r = await jsonp(url);
  if(r.status==='ok'){
    log('método <script> → respondió: ' + esc(JSON.stringify(r.data).slice(0,200)), (r.data.ok || (r.data.error==='auth' && !token)) ? 'ok' : 'bad');
  }else{
    log('método <script> → ' + esc(r.status), 'bad');
  }
}

document.getElementById('run').onclick = async ()=>{
  out.textContent = 'Navegador: ' + navigator.userAgent;
  log('En línea: ' + navigator.onLine);
  log('Dominio de esta página: ' + location.origin);
  log('\nPrueba A (sin sesión). Lo esperado es "auth / no_token":');
  await testFetch('');
  await testJsonp('');
  log('\nSi A y A salen verdes, el celular SÍ llega al script. Ahora toca el botón 2.', 'warn');
};

document.getElementById('login').onclick = async ()=>{
  log('\nIniciando sesión con Google…');
  try{
    const prov = new firebase.auth.GoogleAuthProvider();
    prov.setCustomParameters({prompt:'select_account'});
    const res = await firebase.auth().signInWithPopup(prov);
    const u = res.user;
    log('Cuenta: ' + esc(u.email) + ' | verificado: ' + u.emailVerified, u.emailVerified ? 'ok' : 'bad');
    const tk = await u.getIdToken();
    log('Token obtenido (' + tk.length + ' caracteres)', 'ok');
    log('\nPrueba B (con tu sesión). Lo esperado es ok:true:');
    await testFetch(tk);
    await testJsonp(tk);
  }catch(e){
    log('Error de inicio de sesión: ' + esc(e.code || e.message), 'bad');
  }
};
</script>
</body>
</html>
