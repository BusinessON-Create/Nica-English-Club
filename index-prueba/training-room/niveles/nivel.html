<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nivel — Training Room</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/brands.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css">

<link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>

  <nav class="tr2-nav">
    <span class="tr2-title"><i class="fa-solid fa-brain"></i>Training Room</span>
    <a href="../index.html" class="tr2-link"><i class="fa-solid fa-arrow-left"></i> Niveles</a>
  </nav>

  <div class="tr2-shell" id="tr2-vista-lista">
    <h1 class="tr2-h1" id="tr2-nivel-titulo">Cargando…</h1>
    <div class="tr2-lista-unidades" id="tr2-lista-unidades"></div>
  </div>

  <div class="tr2-shell" id="tr2-vista-unidad" style="display:none;"></div>

  <script type="module">
    import { esperarSesionYAlumno } from "../assets/js/auth-init.js";
    import { cargarUnidades, cargarPagina, renderListaUnidades, renderPortada, renderContenido, activarVelocidad } from "../assets/js/nivel.js";

    const params = new URLSearchParams(location.search);
    const nivelId = params.get('nivel') || 'a1';
    let unidadesCache = [];

    (async function init() {
      const resultado = await esperarSesionYAlumno();
      if (!resultado) return; // auth-init.js ya redirige si no hay sesión/perfil

      document.getElementById('tr2-nivel-titulo').textContent = `Nivel ${nivelId.toUpperCase()}`;

      unidadesCache = await cargarUnidades(nivelId);
      const lista = document.getElementById('tr2-lista-unidades');

      if (!unidadesCache.length) {
        lista.innerHTML = `<p class="tr2-muted">Todavía no hay unidades cargadas para este nivel.</p>`;
        return;
      }

      lista.innerHTML = renderListaUnidades(unidadesCache);
      lista.querySelectorAll('.tr2-card-unidad').forEach((card) => {
        card.onclick = () => abrirUnidad(card.dataset.unidad);
      });
    })();

    async function abrirUnidad(unidadId) {
      const unidad = unidadesCache.find((u) => u.id === unidadId);
      const pagina = await cargarPagina(nivelId, unidadId);
      if (!pagina || !unidad) {
        alert('Esta unidad todavía no tiene contenido cargado.');
        return;
      }

      document.getElementById('tr2-vista-lista').style.display = 'none';
      const vista = document.getElementById('tr2-vista-unidad');
      vista.style.display = 'block';
      vista.innerHTML = renderPortada(unidad, unidadId);

      document.getElementById('btn-volver-lista').onclick = mostrarLista;

      document.getElementById('btn-entrar-clase').onclick = () => {
        vista.innerHTML = renderContenido(pagina, unidad, unidadId);
        activarVelocidad(vista);

        document.getElementById('btn-volver-portada').onclick = () => abrirUnidad(unidadId);

        vista.querySelectorAll('.tr2-tab[data-tab]').forEach((tab) => {
          tab.onclick = () => {
            vista.querySelectorAll('.tr2-tab[data-tab]').forEach((t) => t.classList.remove('active'));
            vista.querySelectorAll('.tr2-tab-panel').forEach((p) => (p.style.display = 'none'));
            tab.classList.add('active');
            document.getElementById(`tr2-tab-${tab.dataset.tab}`).style.display = 'block';
          };
        });
      };
    }

    function mostrarLista() {
      document.getElementById('tr2-vista-unidad').style.display = 'none';
      document.getElementById('tr2-vista-lista').style.display = 'block';
    }
  </script>

</body>
</html>
