<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Room — Nica English</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/brands.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css">

<link rel="stylesheet" href="./assets/css/base.css">
</head>
<body>

  <nav class="tr2-nav" id="tr2-nav"></nav>

  <div class="tr2-shell">
    <h1 class="tr2-h1">Elige tu nivel</h1>
    <p class="tr2-sub">Tu coach desbloquea cada nivel a medida que avanzas.</p>

    <div class="tr2-grid-niveles" id="tr2-grid-niveles">
      <!-- Las 5 tarjetas (A1-C1) se pintan aquí por JS, según training-room.js -->
    </div>
  </div>

  <script type="module">
    import { esperarSesionYAlumno } from "./assets/js/auth-init.js";
    import { pintarNiveles } from "./assets/js/training-room.js";
    import { montarBarra, pintarAvatar } from "./assets/js/barra-red.js";

    montarBarra({ portal: '../' }); // en esta pantalla "atrás" sería igual que Inicio

    (async function init() {
      const resultado = await esperarSesionYAlumno();
      if (!resultado) return; // auth-init.js ya redirige al login si no hay sesión/perfil
      const { alumno } = resultado;

      pintarAvatar(alumno);

      await pintarNiveles(alumno);
    })();
  </script>

</body>
</html>
