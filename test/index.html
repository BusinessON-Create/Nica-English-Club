 if(!/^\S+@\S+\.\S+$/.test(l.correo)) return e.textContent='Escribe un correo válido.';
 if(!l.objetivo||!l.origen) return e.textContent='Completa todas las opciones.';
 if(!document.getElementById('k').checked) return e.textContent='Debes aceptar el uso de tus datos para continuar.';
 S.lead = l; S.t0 = Date.now();
 const ix=Q.map((q,i)=>i);
 const units=LV.flatMap((_,l)=>{const one=shuffle(ix.filter(i=>Q[i][0]===l&&Q[i][1]!=='l')).slice(0,PER-2).map(i=>[i]);const fs=[...new Set(ix.filter(i=>Q[i][0]===l&&Q[i][1]==='l').map(i=>Q[i][5]))],f=fs[Math.random()*fs.length|0];return one.concat([ix.filter(i=>Q[i][5]===f)]);});
 S.order = shuffle(units).flat(); // 8 al azar + 1 audio por nivel, orden aleatorio (las 2 preguntas de un audio van juntas)
 send({...l,codigo:S.code,estado:'inició',utm:P.get('utm_source')||P.get('ref')||'',fecha:new Date().toISOString()});
 ask();
}
function ask(){
 const n = S.i, q = Q[S.order[n]], opts = shuffle(q[3].map((t,k)=>({t,ok:k===0})));
 if(S.au){S.au.pause();S.au=null}
 S.cur = opts; S.pick = null;
 app.innerHTML = head+`<div class="in"><div class="bar"><i style="width:${n/S.order.length*100}%"></i></div>
 <div class="meta"><span>Pregunta ${n+1} de ${S.order.length}</span><span>Sin retroceso</span></div>
 ${q[4]?`<p class="read">${esc(q[4])}</p>`:''}
 ${q[5]?'<div class="player" id="pl"><button class="play" id="pb" aria-label="Reproducir audio">▶</button><div class="pi"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><div class="bar"><i id="pg" style="width:0"></i></div><small id="pn"></small></div></div>':''}
 <div class="q">${esc(q[2])}</div>
 <div id="os">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join('')}</div>
 <button class="btn" id="nx" disabled>${n===S.order.length-1?'Ver mi resultado':'Continuar'}</button></div>`;
 requestAnimationFrame(()=>{const b=document.querySelector('.bar i');b.style.width=((n+1)/S.order.length*100)+'%'});
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.pick=+b.dataset.k;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('nx').disabled=false;});
 document.getElementById('nx').onclick=()=>{S.ans.push(S.cur[S.pick].ok);S.i++;S.i<S.order.length?ask():finish();};
 if(q[5])bindAudio(q[5]);
}
const FB=[
{m:['Revisamos tus respuestas y estás muy cerca de abrir el nivel A1: ya reconoces varias estructuras básicas.','Revisamos tus respuestas: {t} de 50 aciertos nos dicen exactamente dónde empezar contigo, sin presión.'],s:'En {x} mostraste más base que en el resto, y desde ahí vamos a construir.',w:'Con {x} avanzaremos paso a paso: es donde más rápido vas a notar progreso.',p:['Respondiste con agilidad, y eso ayuda mucho a aprender hablando.','Tomaste tu tiempo en cada respuesta, y esa calma sirve para construir bases firmes.'],t:'Tu mejor jugada: unos minutos de práctica real cada día desde la primera semana.'},
{m:['Estás a pocas respuestas de A2: tu base ya es firme.','Tu base A1 es sólida: lo esencial lo respondiste con seguridad.'],s:'Tu punto fuerte hoy es {x}; se nota que ya lo usas con naturalidad.',w:'Un poco más de práctica en {x} te dará el salto más visible.',p:['Tu ritmo fue ágil: reconoces rápido lo básico.','Fuiste con calma y constancia, que es como se consolida lo básico.'],t:'En tu nivel, hablar en frases cortas todos los días vale más que memorizar reglas.'},
{m:['Estás rozando el B1: varias respuestas de nivel intermedio ya te salieron bien.','Tu A2 es estable: te defiendes bien en situaciones del día a día.'],s:'En {x} se nota buen manejo, y eso es una ventaja real en tus conversaciones.',w:'Tu mayor oportunidad ahora está en {x}; con práctica enfocada avanzarás rápido.',p:['Respondiste con buen ritmo, señal de que ya piensas en frases cortas en inglés.','Tu ritmo fue pausado y cuidadoso, lo que ayuda a ganar precisión.'],t:'Tu siguiente salto está en dejar de traducir en tu cabeza: entrenar respuestas rápidas.'},
{m:['Estás muy cerca del B2: ya resolviste parte de las preguntas más avanzadas.','Tu B1 es firme: te comunicas con ideas claras y estructuras variadas.'],s:'Tu mejor resultado fue en {x}, un buen motor para tu avance.',w:'Reforzar {x} te va a dar mucha más naturalidad al hablar.',p:['Mantuviste un ritmo ágil incluso en las preguntas largas.','Tomaste el tiempo para razonar, y eso se nota en tu precisión.'],t:'Ahora toca ganar precisión: hablar más, con corrección directa sobre tus errores reales.'},
{m:['Estás a un paso del C1: resolviste varias preguntas de alto nivel.','Tu B2 es sólido: manejas estructuras complejas con independencia.'],s:'Destacas en {x}, y es una base excelente para el nivel avanzado.',w:'En {x} están los matices que separan un B2 de un C1; vale la pena pulirlos.',p:['Tu ritmo fue rápido y seguro frente a preguntas exigentes.','Fuiste reflexivo en cada respuesta, justo lo que pide este nivel.'],t:'Tu entrenamiento ideal: debate, opinión y corrección fina de matices.'},
{m:['Tu resultado es de nivel avanzado: dominaste casi todo el test, incluidas las estructuras más difíciles.','Llegaste al nivel más alto del test: acertaste {t} de 50, un resultado muy sólido.'],s:'Tu dominio de {x} destaca incluso dentro de un nivel avanzado.',w:'Podemos afinar {x} hasta que suene totalmente natural.',p:['Mantuviste un ritmo muy ágil, como alguien que ya usa el idioma a diario.','Cuidaste cada respuesta con atención, y se nota en el resultado.'],t:'En tu nivel, lo que suma es conversación sin esfuerzo, registro y precisión.'}];
const SN={g:'la gramática en contexto',v:'el vocabulario',r:'la lectura',l:'la comprensión auditiva'};
function count(id,to,ms){const el=document.getElementById(id),t0=performance.now();(function f(t){const p=Math.min((t-t0)/ms,1);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
function confetti(){const c=document.getElementById('cf'),x=c.getContext('2d');if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;c.width=innerWidth;c.height=innerHeight;const cols=['#ffc400','#ffe27a','#f3efe8','#ff9f1c'];const ps=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:Math.random()*7+3,c:cols[Math.random()*4|0],r:Math.random()*6}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++n<170)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
const EXT=['jpeg','jpg','png','webp'];function nx(i){const n=+(i.dataset.n||0)+1;if(n<EXT.length){i.dataset.n=n;i.src=i.dataset.b+'.'+EXT[n]}else i.remove()} // acepta jpeg, jpg, png o webp
function bindAudio(f){
 const pb=document.getElementById('pb'),pn=document.getElementById('pn'),pg=document.getElementById('pg'),pl=document.getElementById('pl');
 S.plays=S.plays||{};const left=()=>2-(S.plays[f]||0);
 const lab=()=>pn.textContent=left()>0?'Escucha el audio. Reproducciones disponibles: '+left()+' de 2':'Ya usaste tus 2 reproducciones';
 const a=new Audio('audio/'+f+'.mp3');S.au=a;lab();if(left()<1)pb.disabled=true;
 a.onerror=()=>{pn.textContent='No se pudo cargar el audio. Revisa tu conexión y recarga la página.';pb.disabled=true};
 a.ontimeupdate=()=>pg.style.width=(a.currentTime/(a.duration||1)*100)+'%';
 a.onended=()=>{pl.classList.remove('on');pg.style.width='0';pb.textContent='▶';pb.disabled=left()<1;lab()};
 pb.onclick=()=>{if(left()<1)return;S.plays[f]=(S.plays[f]||0)+1;pb.disabled=true;pb.textContent='♪';pl.classList.add('on');lab();a.currentTime=0;a.playbackRate=SPEED[f.slice(0,2)]||1;a.preservesPitch=true;a.play().catch(()=>{})};
}
function finish(){
 const lv=[0,0,0,0,0], sc={g:[0,0],v:[0,0],r:[0,0],l:[0,0]};
 S.order.forEach((qi,n)=>{const q=Q[qi],ok=S.ans[n];if(ok){lv[q[0]]++;sc[q[1]][0]++}sc[q[1]][1]++;});
 let k=0; while(k<5&&lv[k]>=PASS)k++; // aprueba un nivel con 6/8 o más, de forma consecutiva
 const R=RES[k], F=FB[k], total=S.ans.filter(Boolean).length, pct=x=>Math.round(x[0]/x[1]*100);
 const mins=Math.round((Date.now()-S.t0)/60000);
 const score=Math.round(lv.reduce((a,c,i)=>a+c*(i+1),0)/(PER*15)*1000);
 const ks=Object.keys(sc).sort((a,b)=>pct(sc[b])-pct(sc[a])), close=k<5?lv[k]>=PER/2:lv[4]===PER;
 const fb=[F.m[close?0:1].replace('{t}',total),F.s.replace('{x}',SN[ks[0]]),F.w.replace('{x}',SN[ks[3]]),F.p[mins<16?0:1],F.t];
 send({...S.lead,codigo:S.code,estado:'completo',nivel:R.n,puntaje:total+'/'+S.order.length,score:score,gramatica:pct(sc.g),vocabulario:pct(sc.v),lectura:pct(sc.r),escucha:pct(sc.l),porNivel:LV.map((n,i)=>n+':'+lv[i]+'/'+PER).join(' '),minutos:mins,utm:P.get('utm_source')||P.get('ref')||'',fecha:new Date().toISOString()});
 const wa='https://wa.me/'+WA+'?text='+encodeURIComponent(`Hola, soy ${S.lead.nombre}. Mi código de test es ${S.code} y mi nivel es ${R.n}. Te envío mi audio:`);
 const bar=(t,x)=>`<div class="sec"><div><span>${t}</span><span>${pct(x)}%</span></div><div class="bar"><i style="width:0" data-w="${pct(x)}"></i></div></div>`;
 app.innerHTML = head+`<div class="in"><p>${esc(S.lead.nombre.split(' ')[0])}, tu nivel de inglés es</p>
 <div class="lvl">${R.n}</div>
 <div class="ladder">${LV.map(n=>`<span>${n}</span>`).join('')}</div>
 <div class="score"><span id="sc">0</span><small> / 1000 · NEC Score</small></div>
 <p>${R.t}</p>
 <h2>Lo que vimos en tu test</h2><ul class="fb">${fb.map((t,i)=>`<li style="animation-delay:${.4+i*.2}s">${esc(t)}</li>`).join('')}</ul>
 <div class="card">${bar('Gramática en contexto',sc.g)}${bar('Vocabulario',sc.v)}${bar('Lectura',sc.r)}${bar('Comprensión auditiva',sc.l)}</div>
 <div class="card" style="margin-top:16px"><h2>Último paso: tu audio</h2>
 <p>Para confirmar tu nivel, un coach necesita escucharte. Envía un audio de 30 a 60 segundos por WhatsApp respondiendo esto, en inglés:</p>
 <p class="read">${esc(R.a)}</p>
 <p>Tu código de test: <span class="code">${S.code}</span></p>
 <a class="btn" href="${wa}" target="_blank" rel="noopener">Enviar mi audio por WhatsApp</a></div>
 <div style="margin-top:18px"><a class="btn ghost" href="${ADMISION}">Aplicar a mi cupo</a></div>
 <p style="margin-top:22px;font-size:.85rem">Este test es una estimación inicial. Tu nivel se confirma con tu audio y con tu coach.</p></div>`;
 S.done=true; scrollTo(0,0);
 setTimeout(()=>document.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'),500);
 document.querySelectorAll('.ladder span').forEach((el,i)=>{if(i<k)setTimeout(()=>el.classList.add('hit'),300+i*260)});
 count('sc',score,1600); confetti();
}
addEventListener('beforeunload',e=>{if(S.t0&&!S.done){e.preventDefault();e.returnValue=''}});
addEventListener('pointermove',e=>{document.body.style.setProperty('--mx',e.clientX+'px');document.body.style.setProperty('--my',e.clientY+'px')});
intro();
</script>
