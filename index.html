<style>
:root {
  --fh:"Bricolage Grotesque",Georgia,serif; --fb:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#0a0908; --border2:#2a251e; --gold:#ffc400; --gold2:#d9a400; --gold3:#ffe27a;
  --white:#ffffff; --muted:#a39b8f; --muted-dim:#6b645a; --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body { font-family:var(--fb); background:radial-gradient(120% 90% at 50% -10%, #13100c 0%, var(--bg) 55%); color:var(--white); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
::selection { background:var(--gold); color:#000; }
.stage { position:relative; z-index:1; min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; padding:max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom)); text-align:center; }
.cabeza { display:flex; flex-direction:column; align-items:center; gap:16px; }
.centro { display:flex; flex-direction:column; align-items:center; gap:20px; }
.pie { display:flex; justify-content:center; margin-top:-6px; }

/* Logo + título + barra: mismo estilo que la pantalla de carga */
.logo { position:relative; width:96px; opacity:0; animation:splashLogo .7s var(--ease) .05s forwards; }
.logo::before { content:""; position:absolute; inset:-40px; background:radial-gradient(closest-side, rgba(255,196,0,.16), transparent); z-index:-1; pointer-events:none; }
.logo img { width:100%; height:auto; display:block; }
.titulo { display:flex; flex-direction:column; align-items:center; font-family:var(--fh); font-weight:800; font-size:clamp(28px,7.4vw,42px); letter-spacing:-.02em; line-height:1.12; padding:0 4px; max-width:640px; }
.titulo { text-wrap:balance; }
.titulo .linea { display:flex; justify-content:center; white-space:nowrap; }
.etq { display:inline-flex; align-items:center; gap:12px; font-size:11px; font-weight:600; letter-spacing:.32em; text-transform:uppercase; color:var(--gold2); opacity:0; animation:splashLogo .5s var(--ease) .25s forwards; }
.etq::before, .etq::after { content:""; width:22px; height:1px; background:linear-gradient(90deg,transparent,var(--gold2)); }
.etq::after { transform:scaleX(-1); }
.titulo .w { display:inline-flex; white-space:nowrap; }
.titulo .sp { display:inline-block; width:.28em; }
.titulo .l { display:inline-block; opacity:0; animation:splashLetra .55s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(.3s + var(--i) * 45ms); }
.titulo .oro { color:var(--gold); text-shadow:0 0 24px rgba(255,196,0,.35); }
.barra { width:min(180px,50vw); height:2px; border-radius:2px; background:var(--border2); overflow:hidden; opacity:0; animation:splashLogo .4s ease 1.1s forwards; }
.barra::after { content:""; display:block; height:100%; width:40%; background:linear-gradient(90deg,transparent,var(--gold),transparent); animation:splashBarra 1.1s ease-in-out infinite; }


/* Mensajes */
.msg { max-width:400px; display:flex; flex-direction:column; align-items:center; gap:12px; opacity:0; animation:splashLogo .6s var(--ease) 1.5s forwards; }
.msg p { text-wrap:balance; }
.msg .en { font-size:clamp(14px,3.8vw,16px); line-height:1.55; color:var(--muted); }
.msg .es { font-size:clamp(13px,3.4vw,14.5px); line-height:1.55; color:var(--muted-dim); opacity:.8; font-style:italic; padding-top:12px; border-top:1px solid var(--border2); width:100%; }
.chip { display:inline-flex; align-items:center; gap:10px; padding:10px 20px; border-radius:99px; border:1px solid rgba(255,196,0,.38); background:rgba(255,196,0,.07); box-shadow:0 0 30px rgba(255,196,0,.10); font-family:var(--fh); font-weight:700; font-size:clamp(12px,3.3vw,13.5px); letter-spacing:.16em; text-transform:uppercase; color:var(--gold3); opacity:0; animation:splashLogo .6s var(--ease) 1.8s forwards; }
.chip b { color:var(--gold2); font-weight:700; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); animation:latido 1.8s ease-in-out infinite; }
@keyframes latido { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.4; transform:scale(.7); } }
.cuenta { display:flex; align-items:flex-start; gap:8px; opacity:0; animation:splashLogo .6s var(--ease) 2.05s forwards; }
.cuenta[hidden], .casi[hidden] { display:none; }
.cuenta i { font-style:normal; font-family:var(--fh); font-weight:800; font-size:clamp(22px,6vw,28px); line-height:50px; color:var(--gold2); opacity:.6; }
.cuenta .u { min-width:68px; padding:10px 8px 9px; border-radius:14px; border:1px solid var(--border2); background:linear-gradient(180deg, rgba(255,196,0,.06), rgba(255,255,255,.01)); display:flex; flex-direction:column; align-items:center; gap:3px; }
.cuenta b { font-family:var(--fh); font-weight:800; font-size:clamp(26px,7.4vw,34px); line-height:1; color:var(--gold); font-variant-numeric:tabular-nums; text-shadow:0 0 18px rgba(255,196,0,.3); }
.cuenta span { font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted-dim); }
.casi { font-family:var(--fh); font-weight:700; font-size:18px; color:var(--gold3); }
.casi em { font-style:italic; font-weight:500; color:var(--muted-dim); margin-left:6px; }
.particulas { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.particulas span { position:absolute; left:var(--x); bottom:-12px; width:var(--s); height:var(--s); border-radius:50%; background:var(--gold); box-shadow:0 0 8px rgba(255,196,0,.7); opacity:0; animation:subir var(--d) linear var(--w) infinite; }
@keyframes subir { 0% { transform:translate(0,0); opacity:0; } 12% { opacity:var(--o); } 85% { opacity:var(--o); } 100% { transform:translate(var(--dx),-108vh); opacity:0; } }
.web { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; letter-spacing:.04em; color:var(--muted-dim); text-decoration:none; padding:8px 14px; border-radius:99px; border:1px solid transparent; opacity:0; animation:splashLogo .6s var(--ease) 2.35s forwards; transition:color .2s var(--ease), border-color .2s var(--ease); -webkit-tap-highlight-color:transparent; }
.web:hover, .web:focus-visible { color:var(--gold); border-color:rgba(255,196,0,.3); outline:none; }
.web svg { width:11px; height:11px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

@keyframes splashLogo { from { opacity:0; transform:scale(.88) translateY(6px); } to { opacity:1; transform:none; } }
@keyframes splashLetra { from { opacity:0; transform:translateY(16px); filter:blur(6px); } to { opacity:1; transform:none; filter:none; } }
@keyframes splashBarra { from { transform:translateX(-100%); } to { transform:translateX(250%); } }
@media (prefers-reduced-motion: reduce) {
  .logo, .etq, .titulo .l, .barra, .msg, .chip, .cuenta, .web { animation:none; opacity:1; filter:none; transform:none; }
  .particulas { display:none; }
  .dot { animation:none; }
}
</style>
