    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08080a; --card: #121214; --card2: #16161a;
            --border: #212127; --border2: #2c2c34;
            --gold: #f0b429; --gold2: #c8891a; --gold3: #ffd966;
            --gold-dim: rgba(240,180,41,0.10); --gold-glow: rgba(240,180,41,0.18);
            --red: #ff5c5c; --green: #00d68f; --blue: #4d9fff;
            --muted: #8a8a97; --muted-dim: #55555f; --text: #e8e8f2;
            --r-sm: 14px; --r: 18px; --r-lg: 22px; --r-xl: 30px;
            --ease: cubic-bezier(.22,1,.36,1);
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: radial-gradient(120% 90% at 50% -10%, #14140f 0%, var(--bg) 55%) fixed;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .font-display { font-family: 'Playfair Display', serif; }
        .font-mono { font-family: 'DM Mono', monospace; }
        .focus-ring:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

        .glass-card {
            background: var(--card);
            border: 1px solid var(--border2);
            box-shadow: 0 20px 50px rgba(0,0,0,.5);
        }

        .nicaragua-gradient {
            background: linear-gradient(135deg, var(--gold2), var(--gold3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .accent-gold { color: var(--gold3); }

        .btn-volver {
            width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--card); border: 1px solid var(--border2); color: var(--text);
            transition: border-color .2s var(--ease), color .2s var(--ease);
            text-decoration: none;
        }
        .btn-volver:hover { border-color: var(--gold2); color: var(--gold3); }
        .logo-badge {
            width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
            background: #0a0a0a; display: flex; align-items: center; justify-content: center;
            padding: 5px; box-shadow: 0 0 0 1px var(--border2);
        }
        .logo-badge img { width: 100%; height: 100%; object-fit: contain; }

        .section-tab {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            white-space: nowrap;
            color: var(--muted);
        }
        .section-tab.active {
            background: linear-gradient(135deg, var(--gold3), var(--gold2));
            color: #08080a;
            box-shadow: 0 8px 20px rgba(200,137,26,.25);
            border-color: transparent;
        }

        .btn-nav {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-weight: 700;
            border-radius: 16px;
            font-size: 0.85rem;
        }

        .cat-tab {
            border: 1px solid var(--border2);
            color: var(--muted);
            transition: all .2s var(--ease);
        }
        .cat-tab:hover { border-color: var(--gold2); color: var(--gold3); }
        .cat-tab.active {
            background: var(--gold-dim);
            border-color: rgba(240,180,41,.4);
            color: var(--gold3);
        }

        .quiz-option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border2);
            padding: 18px;
            border-radius: 20px;
            transition: all 0.2s ease;
            color: var(--text);
        }
        
        .quiz-option.correct {
            background: rgba(0, 214, 143, 0.12);
            border-color: var(--green);
            color: #4ade80;
        }
        .quiz-option.incorrect {
            background: rgba(255, 92, 92, 0.12);
            border-color: var(--red);
            color: #f87171;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes pulse-yellow {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .loading-audio {
            animation: pulse-yellow 1s infinite;
            color: var(--gold3) !important;
        }

        #toastMessage {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: bold;
            display: none;
            backdrop-filter: blur(10px);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .section-tab, .cat-tab, .quiz-option { transition: none; }
        }
    </style>
</head>

            { c: "personalidad", p: "Boludo", t: "Lazy", pf: "Léisi", d: "Persona que no quiere trabajar o que es muy lenta.", e: "Don't be lazy, come help me." },
            { c: "personalidad", p: "Fregado", t: "Troublemaker", pf: "Tróbol-méiquer", d: "Alguien bromista o alguien que molesta mucho.", e: "That kid is such a troublemaker." },
            { c: "personalidad", p: "Mala mía", t: "My bad", pf: "Mai bad", d: "Reconocer un error pequeño de forma rápida.", e: "I forgot the soda. My bad!" },
            { c: "personalidad", p: "Estoy fundido", t: "I'm beat", pf: "Aim bit", d: "Expresar cansancio extremo después de un largo día.", e: "I've been working for 10 hours, I'm beat." },
            { c: "personalidad", p: "Sin paja", t: "No cap", pf: "Nou cáp", d: "Asegurar que se está diciendo la verdad (slang moderno).", e: "That was the best vigorón I've ever had, no cap." },
            { c: "personalidad", p: "Fachento", t: "Show-off", pf: "Shou-of", d: "Persona presumida o que alardea mucho.", e: "Stop being a show-off with that watch." },
            { c: "varios", p: "Chunche", t: "Thing", pf: "Zing", d: "Cualquier objeto cuyo nombre no recordamos.", e: "Can you hand me that thing over there?" },
            { c: "varios", p: "¡Qué falla!", t: "That's a bummer", pf: "Dats a bámer", d: "Reacción ante una noticia decepcionante.", e: "It's raining and we wanted to go out. - That's a bummer." },
            { c: "varios", p: "Vaguear", t: "Hang out", pf: "Jang aut", d: "Pasar tiempo con amigos sin un plan fijo.", e: "Let's hang out at your house today." },
            { c: "varios", p: "Bajale", t: "Chill out", pf: "Chil aut", d: "Pedirle a alguien que se relaje o se calme.", e: "You're too angry, you need to chill out." },
            { c: "varios", p: "Aguantame un toque", t: "Hold on", pf: "Jold on", d: "Pedir a alguien que espere un momento corto.", e: "Hold on, I forgot my wallet." },
            { c: "varios", p: "Chequeá", t: "Check it out", pf: "Chek it aut", d: "Llamar la atención sobre algo interesante.", e: "Check it out! There's a parade on the street." },
            { c: "varios", p: "Está en chino", t: "Long shot", pf: "Long shot", d: "Algo que tiene muy pocas probabilidades de pasar.", e: "Winning the lottery is a long shot." },
            { c: "varios", p: "Riales", t: "Money", pf: "Máni", d: "Dinero. Proviene de la antigua moneda 'Real'.", e: "Can you lend me some money?" },
            { c: "varios", p: "Filo", t: "Hungry", pf: "Hángri", d: "Hambre intensa.", e: "I'm so hungry, let's go get some food." },
            { c: "varios", p: "Chiva", t: "Dangerous", pf: "Déinyerus", d: "Situación peligrosa o de cuidado.", e: "That street is dangerous at night." },
            { c: "varios", p: "Pulpería", t: "Corner Store", pf: "Córner stór", d: "La pequeña tienda del barrio.", e: "Go to the corner store for a soda." }
        ];

        let userScore = 0;
        let currentCorrectOption = "";

        function showToast(msg, type = "error") {
            const toast = document.getElementById('toastMessage');
            toast.innerText = msg;
            toast.style.display = 'block';
            toast.className = type === "error" ? "bg-red-500/90 text-white border border-red-400" : "text-black border";
            if (type !== "error") { toast.style.background = "linear-gradient(135deg, var(--gold3), var(--gold2))"; toast.style.borderColor = "transparent"; }
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        // FUNCIÓN CORREGIDA USANDO NATIVE WEB SPEECH API
        async function speakEnglish(text, btn) {
            if (btn && btn.dataset.loading === "true") return;
            
            if (btn) {
                btn.dataset.loading = "true";
                btn.classList.add('loading-audio');
            }

            // Cancelamos cualquier audio previo
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9; 
            utterance.pitch = 1;

            utterance.onend = () => {
                if (btn) {
                    btn.dataset.loading = "false";
                    btn.classList.remove('loading-audio');
                }
            };

            utterance.onerror = (event) => {
                console.error("SpeechSynthesis Error:", event);
                showToast("Error de audio.");
                if (btn) {
                    btn.dataset.loading = "false";
                    btn.classList.remove('loading-audio');
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        function switchView(view) {
            document.querySelectorAll('.section-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`nav-${view}`).classList.add('active');

            if (view === 'diccionario') {
                document.getElementById('diccionarioView').classList.remove('hidden');
                document.getElementById('quizView').classList.add('hidden');
                document.getElementById('searchBox').style.opacity = "1";
                document.getElementById('searchBox').style.pointerEvents = "auto";
            } else {
                document.getElementById('diccionarioView').classList.add('hidden');
                document.getElementById('quizView').classList.remove('hidden');
                document.getElementById('searchBox').style.opacity = "0";
                document.getElementById('searchBox').style.pointerEvents = "none";
                setupQuiz();
            }
        }

        function setupQuiz() {
            const nextBtn = document.getElementById('nextBtn');
            const feedback = document.getElementById('quizFeedback');
            const optionsContainer = document.getElementById('quizOptions');
            nextBtn.classList.add('hidden');
            feedback.classList.add('hidden');
            optionsContainer.innerHTML = '';

            const correctItem = slangData[Math.floor(Math.random() * slangData.length)];
            currentCorrectOption = correctItem.t;
            document.getElementById('quizWord').innerText = correctItem.p;

            let options = [correctItem.t];
            while (options.length < 4) {
                const randomItem = slangData[Math.floor(Math.random() * slangData.length)];
                if (!options.includes(randomItem.t)) options.push(randomItem.t);
            }
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option w-full font-bold text-white text-left flex justify-between items-center outline-none';
                btn.innerHTML = `<span>${opt}</span> <svg class="w-6 h-6 opacity-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>`;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const feedback = document.getElementById('quizFeedback');
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(o => o.disabled = true);

            if (selected === currentCorrectOption) {
                userScore += 10;
                document.getElementById('score').innerText = userScore;
                btn.classList.add('correct');
                btn.querySelector('svg').classList.remove('opacity-0');
                feedback.innerText = "¡Deacachimba!";
                feedback.className = "mb-6 py-3 rounded-2xl font-black text-sm uppercase tracking-widest text-green-400 bg-green-500/10 block";
                speakEnglish(currentCorrectOption);
            } else {
                btn.classList.add('incorrect');
                feedback.innerText = `¡Ideay! Era: ${currentCorrectOption}`;
                feedback.className = "mb-6 py-3 rounded-2xl font-black text-sm uppercase tracking-widest text-red-400 bg-red-500/10 block";
                options.forEach(o => {
                    if(o.innerText.trim() === currentCorrectOption) o.classList.add('correct');
                });
            }
            feedback.classList.remove('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function filterCategory(cat) {
            document.querySelectorAll('#diccionarioView button').forEach(tab => {
                tab.classList.remove('active');
            });
            const target = document.getElementById(`tab-${cat}`);
            if(target) {
                target.classList.add('active');
            }
            
            const filtered = cat === 'todos' ? slangData : slangData.filter(i => i.c === cat);
            renderDictionary(filtered);
        }

        function renderDictionary(data) {
            const grid = document.getElementById('dictionaryGrid');
            const empty = document.getElementById('emptyState');
            grid.innerHTML = '';
            
            if (data.length === 0) { 
                empty.classList.remove('hidden'); 
                return; 
            }
            empty.classList.add('hidden');

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-[24px] p-6 flex flex-col border-white/5 hover:border-white/20 transition-all group';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <h2 class="font-display text-2xl text-white">${item.p}</h2>
                        <span class="text-[8px] font-black uppercase px-2 py-1 rounded-md" style="background:rgba(77,159,255,.1); color:var(--blue); border:1px solid rgba(77,159,255,.25);">${item.c}</span>
                    </div>
                    <div class="flex flex-col gap-1 mb-5">
                        <div class="flex items-center gap-2">
                            <span class="accent-gold font-black text-xl uppercase tracking-tighter">${item.t}</span>
                            <button onclick="speakEnglish('${item.t.replace(/'/g, "\\'")}', this)" class="p-2 rounded-xl transition-colors focus-ring" style="background:var(--card2); color:var(--muted);" onmouseover="this.style.color='var(--gold3)'" onmouseout="this.style.color='var(--muted)'">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                            </button>
                        </div>
                        <div class="font-mono text-[10px] text-gray-500 italic">/${item.pf}/</div>
                    </div>
                    <p class="text-gray-400 text-xs leading-relaxed mb-5 flex-grow">${item.d}</p>
                    <div class="rounded-2xl p-4 transition-colors" style="background:var(--gold-dim); border:1px solid rgba(240,180,41,.15);">
                        <p class="text-[8px] font-black uppercase tracking-widest mb-1.5" style="color:var(--gold3)">Ejemplo:</p>
                        <p class="text-xs italic text-gray-200">"${item.e}"</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase().trim();
            const filtered = slangData.filter(i => 
                i.p.toLowerCase().includes(val) || 
                i.d.toLowerCase().includes(val) || 
                i.t.toLowerCase().includes(val)
            );
            renderDictionary(filtered);
        });

        window.onload = () => filterCategory('todos');
    </script>
</body>
</html>
